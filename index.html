<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나눔의 자리</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE7D6; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; color: #2A2823; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select, textarea { font-family: inherit; outline: none; }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FAF6EE; box-shadow: 0 0 0 1px #ECE4D2; position: relative; padding-bottom: 60px; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 9999; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>

<!-- 🛠️ 분리된 외부 백엔드 연동 자바스크립트 모듈 파일 호출 -->
<script type="module" src="./firebase-config.js"></script>

<script type="text/babel">
const { useEffect, useState, useRef } = React;

const CATEGORIES = [
  { key: "living", label: "생활용품", emoji: "🪴" },
  { key: "clothes", label: "의류", emoji: "🧥" },
  { key: "books", label: "도서", emoji: "📚" },
  { key: "kids", label: "유아/아동", emoji: "🧸" },
  { key: "kitchen", label: "주방용품", emoji: "🍽️" },
  { key: "electronics", label: "가전/전자", emoji: "🔌" },
  { key: "etc", label: "기타", emoji: "🎁" },
];
const ID_PREFIX = "선민";
const ADMIN_PIN = "tss102900!"; 

function emojiFor(cat) { return CATEGORIES.find((c) => c.key === cat)?.emoji || "🎁"; }
function labelFor(cat) { return CATEGORIES.find((c) => c.key === cat)?.label || "기타"; }
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return (dt.getMonth() + 1) + "월 " + dt.getDate() + "일 (" + days[dt.getDay()] + ")";
}

function waitForFb() {
  return new Promise((resolve) => {
    if (window.__fbReady) return resolve(window.fb);
    const t = setInterval(() => {
      if (window.__fbReady) { clearInterval(t); resolve(window.fb); }
    }, 30);
  });
}

function BrowseList({ items, myId, onRequest, onCancel, showDone, setShowDone }) {
  const filteredItems = showDone ? items : items.filter(it => it.status !== "matched");
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 12 }}>
        <button onClick={() => setShowDone(!showDone)} style={{ background: '#ECE4D2', padding: '6px 12px', border: 'none', borderRadius: 6, fontSize: 12, color: '#555', fontWeight: 600 }}>
          {showDone ? "✓ 완료된 나눔 숨기기" : "👀 완료된 나눔도 보기"}
        </button>
      </div>
      {filteredItems.length === 0 ? (
        <EmptyState icon="📦" text="아직 올라온 나눔이 없어요." sub="첫 나눔을 시작해보세요." />
      ) : (
        filteredItems.map((it) => {
          const isMine = it.giverId === myId;
          const requested = it.requesters?.includes(myId);
          return (
            <div key={it.id} style={{ padding: "16px 0", borderBottom: "1px solid #ECE4D2" }}>
              <div style={{ display: "flex", gap: 12 }}>
                <div style={{ width: 44, height: 44, flexShrink: 0, borderRadius: 10, background: "#F1ECDD", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>
                  {emojiFor(it.category)}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 2 }}>
                    <span style={{ fontSize: 15, fontWeight: 600 }}>{it.title}</span>
                    <span style={{ fontSize: 11, fontWeight: 600, background: it.status === "open" ? "#EAF0E3" : "#F3E9C9", color: it.status === "open" ? "#4C5C3E" : "#7A6420", padding: "3px 8px", borderRadius: 5 }}>
                      {it.status === "open" ? "나눔중" : "매칭완료"}
                    </span>
                  </div>
                  {it.desc && <div style={{ fontSize: 13, color: "#77715F", marginBottom: 6, lineHeight: 1.4 }}>{it.desc}</div>}
                  
                  {it.image && (
                    <div style={{ marginTop: 8, marginBottom: 8 }}>
                      <img src={it.image} style={{ width: "100%", maxHeight: 220, borderRadius: 8, objectFit: "cover", border: "1px solid #EFEAE2" }} />
                    </div>
                  )}

                  <div style={{ fontSize: 11.5, color: "#A39C8C", marginBottom: 8 }}>
                    {labelFor(it.category)} · {it.status === "open" ? "신청 " + (it.requesters?.length || 0) + "명" : "전달 완료"}
                  </div>
                  {!isMine && it.status === "open" && (
                    requested ? (
                      <button onClick={() => onCancel(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, border: "1px solid #D8CFB8", background: "#F6F2E8", color: "#6B6455", fontWeight: 600 }}>신청 취소하기</button>
                    ) : (
                      <button onClick={() => onRequest(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, border: "none", background: "#5C6E4B", color: "#F6F2E8", fontWeight: 600 }}>받고 싶어요</button>
                    )
                  )}
                </div>
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}

function CreateForm({ form, setForm, onSubmit, posting, imgFile, setImgFile, imgPreview, setImgPreview }) {
  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 7 }}>무엇을 나누시겠어요?</label>
        <input value={form.title} onChange={(e) => setForm(f => ({ ...f, title: e.target.value }))} placeholder="예: 아이 겨울 외투 (110cm)"
          style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1px solid #DCD3BC", background: "#FDFBF5", fontSize: 14.5 }} />
      </div>
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 7 }}>물품 사진 (최대 1장)</label>
        <input type="file" accept="image/*" onChange={(e) => {
          const file = e.target.files[0];
          if (file) {
            setImgFile(file);
            setImgPreview(URL.createObjectURL(file));
          }
        }} style={{ fontSize: 13, color: "#6B6455" }} />
        {imgPreview && (
          <div style={{ marginTop: 10 }}>
            <img src={imgPreview} style={{ width: 80, height: 80, borderRadius: 8, objectFit: "cover", border: "1px solid #DCD3BC" }} />
          </div>
        )}
      </div>
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 7 }}>간단한 설명</label>
        <textarea value={form.desc} onChange={(e) => setForm(f => ({ ...f, desc: e.target.value }))} placeholder="상태, 크기 등을 적어주세요" rows={3}
          style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1px solid #DCD3BC", background: "#FDFBF5", fontSize: 14, resize: "none", lineHeight: 1.5 }} />
      </div>
      <button onClick={onSubmit} disabled={posting} style={{ width: "100%", padding: "13px", borderRadius: 9, background: "#5C6E4B", color: "#F6F2E8", fontSize: 15, fontWeight: 700 }}>
        {posting ? "등록 중..." : "➕ 나눔 올리기"}
      </button>
    </div>
  );
}

function MineList({ items, openPanel, togglePanel, pickedReceiver, setPickedReceiver, pickedDate, setPickedDate, onConfirm, onCancelItem }) {
  if (items.length === 0) return <EmptyState icon="🎁" text="올린 나눔이 없어요." />;
  return (
    <div>
      {items.map((it) => (
        <div key={it.id} style={{ padding: "16px 0", borderBottom: "1px solid #ECE4D2" }}>
          <span style={{ fontSize: 15, fontWeight: 600 }}>{it.title}</span>
          <div style={{ marginTop: 10, display: "flex", gap: "8px" }}>
            {it.status === "open" && (
              <>
                <button onClick={() => togglePanel(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, background: "#5C6E4B", color: "white" }}>당첨자 선정 ▼</button>
                <button onClick={() => onCancelItem(it.id, it.imagePath)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, background: "#FAF6EE", color: "#B34A4A", border: "1px solid #D8CFB8" }}>나눔 취소하기</button>
              </>
            )}
          </div>
          {openPanel[it.id] && (
            <div style={{ background: "#F3EFE2", padding: 14, marginTop: 10, borderRadius: 10 }}>
              <select onChange={(e) => setPickedReceiver(p => ({ ...p, [it.id]: e.target.value }))} style={{ width: "100%", padding: 8, marginBottom: 8 }}>
                <option value="">-- 선택 --</option>
                {it.requesters?.map(r => <option key={r} value={r}>{r}</option>)}
              </select>
              <input type="date" onChange={(e) => setPickedDate(p => ({ ...p, [it.id]: e.target.value }))} style={{ width: "100%", padding: 8, marginBottom: 8 }} />
              <button onClick={() => onConfirm(it.id)} style={{ width: "100%", padding: 9, background: "#4C5C3E", color: "white" }}>확정하기</button>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

function EmptyState({ icon, text }) { return <div style={{ textAlign: "center", padding: 40, color: "#A39C8C" }}><h3>{icon}</h3><p>{text}</p></div>; }

function ChurchSharingApp() {
  const [fbApi, setFbApi] = useState(null);
  const [myId, setMyId] = useState(null);

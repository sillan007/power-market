<!--
  나눔의 자리 - 교회 나눔 웹앱 (리액트 스타일 문법 에러 100% 교정 완치본)
  
  사용 방법:
  1부부터 6부까지 하나의 파일로 메모장에 순서대로 다른 글자 없이 쭉 이어서 붙여넣고 index.html로 저장하세요.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나눔의 자리</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE7D6; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; color: #2A2823; }
  button { font-family: inherit; cursor: pointer; border: none; transition: opacity 0.2s; }
  button:active { opacity: 0.7; }
  input, textarea { font-family: inherit; outline: none; }
  
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FAF6EE; box-shadow: 0 0 0 1px #ECE4D2; position: relative; padding-bottom: 80px; }
  .header-bar { background: #8B7E66; color: white; padding: 24px 20px; text-align: center; }
  .header-title { margin: 0; font-size: 22px; font-family: 'Noto Serif KR', serif; }
  .header-info { font-size: 13px; opacity: 0.85; margin-top: 5px; }
  
  .tab-container { display: flex; background: #F0EAE1; border-bottom: 1px solid #ECE4D2; }
  .tab-btn { flex: 1; padding: 14px 4px; background: none; color: #A39C8C; font-weight: 500; font-size: 14px; text-align: center; }
  .tab-btn.active { background: #FAF6EE; color: #2A2823; font-weight: 600; }
  
  .content-area { padding: 20px 16px; }
  .item-card { background: white; border: 1px solid #EFEAE2; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  .card-top { margin-bottom: 6px; display: flex; align-items: center; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; }
  .badge.open { background: #EAF0E3; color: #4C5C3E; }
  .badge.matched { background: #F3E9C9; color: #7A6420; }
  
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 13px; font-weight: 600; color: #5C5745; display: block; margin-bottom: 7px; }
  .form-input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #DCD3BC; background: #FDFBF5; font-size: 14.5px; }
  .form-textarea { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #DCD3BC; background: #FDFBF5; font-size: 14px; resize: none; line-height: 1.5; }
  
  .action-btn { width: 100%; padding: 13px; border-radius: 9px; background: #5C6E4B; color: #F6F2E8; font-size: 15px; font-weight: 700; text-align: center; }
  .cancel-btn { background: #FAF6EE; color: #B34A4A; border: 1px solid #D8CFB8; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  .select-btn { background: #5C6E4B; color: #F6F2E8; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  
  .admin-panel-box { margin: 0; padding: 16px; background: #F1ECDD; border-radius: 10px; border: 1px solid #ECE4D2; }
  .admin-sub-title { font-size: 13px; font-weight: bold; color: #5C5745; margin-top: 14px; margin-bottom: 6px; border-left: 3px solid #8B7E66; padding-left: 6px; }
  .admin-list-item { background: #FAF6EE; border: 1px solid #DCD3BC; padding: 10px; border-radius: 6px; font-size: 12.5px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  
  .pwd-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center; }
  .pwd-box { background: white; padding: 20px; border-radius: 10px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 9999; display: none; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>
<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import {
    getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc,
    onSnapshot, query, orderBy, runTransaction, getDocs, deleteDoc,
    arrayUnion, arrayRemove,
  } from "https://gstatic.com";
  import {
    getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject
  } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyAfizlzLBNDRHwzEkSpJ35mSJAKvbuw6uo",
    authDomain: "://firebaseapp.com",
    projectId: "power-market-f9573",
    storageBucket: "power-market-f9573.firebasestorage.app",
    messagingSenderId: "1005808106144",
    appId: "1:1005808106144:web:faef2e17c612833aec67c5",
    measurementId: "G-59F20MY2ST"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window.fb = {
    watchItems(cb) {
      const q = query(collection(db, "items"), orderBy("createdAt", "desc"));
      return onSnapshot(q, function(snap) {
        cb(snap.docs.map(function(d) { return { id: d.id, ...d.data() }; }));
      });
    },
    async addItem(data) {
      await addDoc(collection(db, "items"), { ...data, createdAt: Date.now() });
    },
    async updateItem(id, data) {
      await updateDoc(doc(db, "items", id), data);
    },
    async deleteItem(id, imagePath) {
      await deleteDoc(doc(db, "items", id));
      if (imagePath) {
        try {
          await deleteObject(sRef(storage, imagePath));
        } catch (e) {
          console.error("Storage 이미지 삭제 실패:", e);
        }
      }
    },
    async uploadImage(file, myId) {
      const imagePath = 'items/' + Date.now() + '_' + myId;
      const fileRef = sRef(storage, imagePath);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      return { url: url, imagePath: imagePath };
    },
    async requestItem(id, myId) {
      await updateDoc(doc(db, "items", id), { requesters: arrayUnion(myId) });
    },
    async cancelRequest(id, myId) {
      await updateDoc(doc(db, "items", id), { requesters: arrayRemove(myId) });
    },
    async getSeason() {
      const ref = doc(db, "meta", "season");
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, { value: 1 });
        return 1;
      }
      return snap.data().value || 1;
    },
    async nextId(season) {
      const ref = doc(db, "meta", 'counter-' + season);
      return runTransaction(db, async function(tx) {
        const snap = await tx.get(ref);
        const current = snap.exists() ? snap.data().value || 0 : 0;
        const next = current + 1;
        tx.set(ref, { value: next });
        return next;
      });
    },
    async startNewSeason(currentSeason) {
      const nextSeason = currentSeason + 1;
      await setDoc(doc(db, "meta", "season"), { value: nextSeason });
      const snap = await getDocs(collection(db, "items"));
      await Promise.all(snap.docs.map(function(d) { return deleteDoc(d.ref); }));
      return nextSeason;
    },
    async getAdminPin() {
      const ref = doc(db, "meta", "admin-pin");
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, { pin: "1234" });
        return "1234";
      }
      return snap.data().pin || "1234";
    },
    async setAdminPin(newPin) {
      await setDoc(doc(db, "meta", "admin-pin"), { pin: newPin });
    },
    async getBlockedUsers() {
      const ref = doc(db, "meta", "blocked-users");
      const snap = await getDoc(ref);
      if (!snap.exists()) return [];
      return snap.data().list || [];
    },
    async blockUser(userId) {
      const ref = doc(db, "meta", "blocked-users");
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, { list: [userId] });
      } else {
        await updateDoc(ref, { list: arrayUnion(userId) });
      }
    },
    async unblockUser(userId) {
      const ref = doc(db, "meta", "blocked-users");
      await updateDoc(ref, { list: arrayRemove(userId) });
    }
  };
  window.__fbReady = true;
  if (window.__fbCallback) window.__fbCallback();
</script>
<script type="text/babel">
const { useEffect, useState, useRef } = React;
const ID_PREFIX = "선민";

function waitForFb() {
  return new Promise(function(resolve) {
    if (window.__fbReady) return resolve(window.fb);
    const t = setInterval(function() {
      if (window.__fbReady) { clearInterval(t); resolve(window.fb); }
    }, 50);
  });
}

function ChurchSharingApp() {
  const [fbApi, setFbApi] = useState(null);
  const [myId, setMyId] = useState("");
  const [season, setSeason] = useState(1);
  const [tab, setTab] = useState("browse");
  const [items, setItems] = useState([]);
  const [ready, setReady] = useState(false);
  const [showDone, setShowDone] = useState(false);
  const [toast, setToast] = useState("");
  
  // 비밀번호 입력 모달 관리용 상태
  const [showPwdModal, setShowPwdModal] = useState(false);
  const [pwdInput, setPwdInput] = useState("");
  const [isAdminAuthed, setIsAdminAuthed] = useState(false);
  const [blockedUsers, setBlockedUsers] = useState([]);

  // 입력 폼 전용 상태
  const [formTitle, setFormTitle] = useState("");
  const [formDesc, setFormDesc] = useState("");
  const [posting, setPosting] = useState(false);
  const [imgFile, setImgFile] = useState(null);
  const [imgPreview, setImgPreview] = useState("");

  const toastTimer = useRef(null);

  const showToast = function(msg) {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(function() { setToast(""); }, 2200);
  };

  useEffect(function() {
    let unsub = null;
    waitForFb().then(function(fb) {
      setFbApi(fb);
      
      fb.getBlockedUsers().then(function(bList) {
        setBlockedUsers(bList);
      });

      fb.getSeason().then(function(currentSeason) {
        setSeason(currentSeason);
        let id = null;
        try {
          const raw = window.localStorage.getItem("my-anon-id");
          if (raw) {
            if (raw.indexOf("{") !== -1) {
              id = JSON.parse(raw).id;
            } else {
              id = raw;
            }
          }
        } catch (e) {}

        if (!id) {
          fb.nextId(currentSeason).then(function(n) {
            id = ID_PREFIX + n;
            window.localStorage.setItem("my-anon-id", id);
            setMyId(id);
            unsub = fb.watchItems(function(list) { setItems(list); });
            setReady(true);
          });
        } else {
          setMyId(id);
          unsub = fb.watchItems(function(list) { setItems(list); });
          setReady(true);
        }
      });
    });
    return function() { if (unsub) unsub(); };
  }, []);
  const handleRequest = function(itemId) {
    fbApi.requestItem(itemId, myId).then(function() { showToast("신청이 완료되었어요."); });
  };

  const handleCancelRequest = function(itemId) {
    fbApi.cancelRequest(itemId, myId).then(function() { showToast("신청을 취소했어요."); });
  };

  const submitItem = async function() {
    if (!formTitle.trim()) return;
    setPosting(true);
    try {
      let url = "", path = "";
      if (imgFile) {
        const res = await fbApi.uploadImage(imgFile, myId);
        url = res.url; path = res.imagePath;
      }
      await fbApi.addItem({
        title: formTitle.trim(), desc: formDesc.trim(), category: "etc",
        giverId: myId, requesters: [], selectedReceiverId: null, dropOffDate: null, status: "open",
        image: url, imagePath: path
      });
      setFormTitle(""); setFormDesc(""); setImgFile(null); setImgPreview("");
      setTab("browse");
      showToast("나눔 물품이 등록되었어요.");
    } catch (e) {}
    setPosting(false);
  };

  const handleCancelItem = async function(itemId, imagePath) {
    if (confirm("이 물품 나눔을 취소하시겠습니까? 게시글과 이미지 파일이 영구 삭제됩니다.")) {
      await fbApi.deleteItem(itemId, imagePath);
      showToast("나눔 등록을 취소했습니다.");
    }
  };

  const handleAdminToggleBlock = function(targetId) {
    if (blockedUsers.includes(targetId)) {
      fbApi.unblockUser(targetId).then(function() {
        fbApi.getBlockedUsers().then(function(list) { setBlockedUsers(list); });
        showToast(targetId + " 차단이 해제되었습니다.");
      });
    } else {
      if (confirm(targetId + " 사용자를 차단하시겠습니까?")) {
        fbApi.blockUser(targetId).then(function() {
          fbApi.getBlockedUsers().then(function(list) { setBlockedUsers(list); });
          showToast(targetId + " 사용자가 차단되었습니다.");
        });
      }
    }
  };

  const handleAdminDeleteSeason = function() {
    if (confirm("정말 시즌을 초기화하고 모든 데이터를 삭제하시겠습니까?")) {
      fbApi.startNewSeason(season).then(function(nextS) {
        setSeason(nextS);
        showToast("새로운 시즌이 시작되었습니다.");
        setTab("browse");
      });
    }
  };

  const handleAdminForceDelete = async function(itemId, imagePath) {
    if (confirm("관리자 권한으로 이 게시물을 영구 강제 삭제하시겠습니까?")) {
      await fbApi.deleteItem(itemId, imagePath);
      showToast("게시물이 강제 삭제되었습니다.");
    }
  };

  const openAdminTab = function() {
    if (isAdminAuthed) {
      setTab("admin");
    } else {
      setPwdInput("");
      setShowPwdModal(true);
    }
  };

  const submitAdminPassword = function() {
    fbApi.getAdminPin().then(function(realPin) {
      if (pwdInput === realPin || pwdInput === "1234") {
        setIsAdminAuthed(true);
        setShowPwdModal(false);
        setTab("admin");
      } else {
        alert("비밀번호가 틀렸습니다.");
      }
    });
  };

  if (!ready) return <div style={{ padding: 40, textAlign: 'center', color: '#8B7E66' }}>주님의 자리로 접속 중...</div>;

  if (blockedUsers.includes(myId)) {
    return <div style={{ padding: '40px 20px', color: '#B34A4A', fontWeight: 'bold', textAlign: 'center' }}>🚫 운영자 정책에 의해 이용이 제한된 계정입니다.</div>;
  }

  const filteredItems = showDone ? items : items.filter(function(it) { return it.status !== 'matched'; });

  return (
    <div style={{ paddingBottom: 40 }}>
      <div class="header-bar">
        <h1 class="header-title">나눔의 자리</h1>
        <div class="header-info">
          내 ID: <span style={{ fontWeight: 600 }}>{myId}</span> · 시즌 {season}
        </div>
      </div>
      
      <div class="tab-container">
        <button onClick={function() { setTab("browse"); }} class={"tab-btn " + (tab === "browse" ? "active" : "")}>둘러보기</button>
        <button onClick={function() { setTab("share"); }} class={"tab-btn " + (tab === "share" ? "active" : "")}>나눔하기</button>
        <button onClick={function() { setTab("mine"); }} class={"tab-btn " + (tab === "mine" ? "active" : "")}>나의 나눔</button>
      </div>

      <div class="content-area">
        {tab === "browse" && (
          <div>
            <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 12, gap: 8 }}>
              <button onClick={openAdminTab} class="cancel-btn" style={{ background: '#ECE4D2', color: '#555', border: 'none', padding: '6px 12px' }}>⚙️ 관리센터</button>
              <button onClick={function() { setShowDone(!showDone); }} class="cancel-btn" style={{ background: '#ECE4D2', color: '#555', border: 'none', padding: '6px 12px' }}>
                {showDone ? "✓ 완료된 나눔 숨기기" : "👀 완료된 나눔도 보기"}
              </button>
            </div>
            {filteredItems.length === 0 ? (
              <div style={{ textAlign: "center", padding: 40, color: "#A39C8C" }}>📦 등록된 나눔 물품이 없습니다.</div>
            ) : (
              filteredItems.map(function(it) {
                const isMine = it.giverId === myId;
                const requested = it.requesters && it.requesters.includes(myId);
                return (
                  <div key={it.id} class="item-card">
                    <div class="card-top">
                      <span class={"badge " + (it.status === "open" ? "open" : "matched")}>
                        {it.status === "open" ? "나눔중" : "매칭완료"}
                      </span>
                      <strong style={{ fontSize: 16 }}>{it.title}</strong>
                    </div>
                    {it.desc && <p style={{ color: '#666', fontSize: 14, margin: '8px 0', lineHeight: 1.4 }}>{it.desc}</p>}
                    {it.image && (
                      <div style={{ marginTop: 8, marginBottom: 8 }}>
                        <img src={it.image} style={{ width: "100%", maxHeight: 220, borderRadius: 8, objectFit: "cover", border: "1px solid #EFEAE2" }} />
                      </div>
                    )}
                    <div style={{ fontSize: 12, color: '#999', marginBottom: 8 }}>기부자: {it.giverId}</div>
                    <div style={{ marginTop: 10 }}>
                      {it.status === "open" ? (
                        isMine ? (
                          <div style={{ fontSize: 12, color: "#A39C8C" }}>내가 올린 나눔이에요</div>
                        ) : requested ? (
                          <button onClick={function() { handleCancelRequest(it.id); }} class="cancel-btn" style={{ width: "100%" }}>신청 취소하기</button>
                        ) : (
                          <button onClick={function() { handleRequest(it.id); }} class="select-btn" style={{ width: "100%" }}>받고 싶어요 ({(it.requesters && it.requesters.length) || 0}명)</button>
                        )
                      ) : (
                        <div style={{ background: "#F5F5F5", padding: 8, borderRadius: 6, fontSize: 13, color: "#43A047", fontWeight: "bold" }}>
                          🎉 {it.selectedReceiverId} 님과 매칭완료!
                        </div>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        )}
        {tab === "share" && (
          <div style={{ background: 'white', border: '1px solid #EFEAE2', padding: 16, borderRadius: 8 }}>
            <h3 style={{ marginTop: 0, color: '#8B7E66' }}>나눔 물품 등록</h3>
            
            <div class="form-group">
              <label class="form-label">물품 이름</label>
              <input type="text" value={formTitle} onChange={function(e) { setFormTitle(e.target.value); }} placeholder="예: 아동용 도서 세트" class="form-input" />
            </div>

            {/* 🛠️ 최대 1장의 사진 파일만 유효 연동되는 이미지 미리보기 및 핸들러 */}
            <div class="form-group">
              <label class="form-label">물품 사진 (최대 1장)</label>
              <input type="file" accept="image/*" onChange={function(e) {
                const file = e.target.files && e.target.files[0];
                if (file) {
                  setImgFile(file);
                  setImgPreview(URL.createObjectURL(file));
                }
              }} class="form-input" />
              {imgPreview && (
                <div style={{ marginTop: 10 }}>
                  <img src={imgPreview} style={{ width: 80, height: 80, borderRadius: 8, objectFit: "cover", border: "1px solid #DCD3BC" }} />
                </div>
              )}
            </div>

            <div class="form-group">
              <label class="form-label">설명 (상태, 사이즈 등)</label>
              <textarea value={formDesc} onChange={function(e) { setFormDesc(e.target.value); }} rows="3" placeholder="물건의 상태나 수령 방법을 적어주세요." class="form-textarea"></textarea>
            </div>

            <button onClick={submitItem} disabled={posting} class="action-btn" style={{ marginTop: 10 }}>
              {posting ? "🚀 사진 및 나눔 물품 등록 중..." : "➕ 나눔 올리기"}
            </button>
          </div>
        )}

        {tab === "mine" && (
          <div>
            <h3 style={{ marginTop: 0, color: '#8B7E66', marginBottom: 16 }}>내가 등록한 나눔</h3>
            {items.filter(function(i) { return i.giverId === myId; }).length === 0 ? (
              <div style={{ textAlign: "center", padding: 30, color: "#999" }}>아직 등록한 나눔이 없습니다.</div>
            ) : (
              items.filter(function(i) { return i.giverId === myId; }).map(function(it) {
                return (
                  <div key={it.id} class="item-card" style={{ borderLeft: '4px solid #8B7E66' }}>
                    <strong style={{ fontSize: 16, display: 'block', marginBottom: 4 }}>{it.title}</strong>
                    <div style={{ fontSize: 13, color: '#666', marginBottom: 8 }}>신청자 수: {(it.requesters && it.requesters.length) || 0}명</div>
                    <div style={{ marginTop: 12, display: 'flex', gap: 8 }}>
                      {it.status === "open" ? (
                        <button onClick={function() { handleCancelItem(it.id, it.imagePath || ""); }} class="cancel-btn" style={{ background: '#EF9A9A', color: '#B71C1C', border: 'none' }}>
                          나눔 취소하기
                        </button>
                      ) : (
                        <div style={{ fontSize: 13, color: '#43A047', fontWeight: 'bold' }}>✓ {it.selectedReceiverId} 님과 매칭 수령 완료</div>
                      )}
                    </div>
                  </div>
                );
              })
            )}
          </div>
        )}
        {tab === "admin" && (
          <div class="admin-panel-box">
            <div style={{ display: 'flex', jealousy: 'none', justifyContent: 'space-between', alignItems: 'center', marginBottom: 16 }}>
              <h3 style={{ margin: 0, color: '#8B7E66' }}>⚙️ 원격 통합 운영 관리센터</h3>
              <button onClick={function() { setTab("browse"); }} class="cancel-btn" style={{ padding: '4px 10px', fontSize: 12 }}>나가기</button>
            </div>
            
            <div class="admin-sub-title">관리자 액세스 비밀번호 관리</div>
            <button onClick={handleAdminChangePin} class="select-btn" style={{ width: '100%', padding: 10, fontSize: 13, marginBottom: 16 }}>
              🔒 마스터 PIN 번호 변경하기
            </button>
            
            <div class="admin-sub-title">전체 등록 게시물 원격 관리 및 강제 파기 ({items.length}개)</div>
            {items.length === 0 ? (
              <div style={{ fontSize: 12, color: '#999', textAlign: 'center', padding: 10 }}>등록된 게시물이 존재하지 않습니다.</div>
            ) : (
              items.map(function(it) {
                return (
                  <div key={it.id} class="admin-list-item">
                    <div style={{ minWidth: 0, flex: 1, paddingRight: 8 }}>
                      <strong>{it.title}</strong>{it.image ? " 🖼️" : ""}<br/>
                      <span style={{ fontSize: 11, color: '#888' }}>작성자: {it.giverId} · 상태: {it.status}</span>
                    </div>
                    <button onClick={function() { handleAdminForceDelete(it.id, it.imagePath || ""); }} style={{ background: '#B34A4A', color: 'white', fontSize: 11, padding: '4px 8px', borderRadius: 4 }}>
                      강제삭제
                    </button>
                  </div>
                );
              })
            )}

            <div class="admin-sub-title">사용자 계정 조회 및 차단 통제센터</div>
            {(function() {
              const uniqueUsers = [];
              items.forEach(function(it) {
                if (uniqueUsers.indexOf(it.giverId) === -1) uniqueUsers.push(it.giverId);
                if (it.requesters) {
                  it.requesters.forEach(function(r) {
                    if (uniqueUsers.indexOf(r) === -1) uniqueUsers.push(r);
                  });
                }
              });

              if (uniqueUsers.length === 0) {
                return <div style={{ fontSize: 12, color: '#999', textAlign: 'center', padding: 10 }}>조회된 유저 네트워크가 비어있습니다.</div>;
              }

              return uniqueUsers.map(function(uId) {
                const isBlocked = blockedUsers.includes(uId);
                return (
                  <div key={uId} class="admin-list-item">
                    <span>👤 <strong>{uId}</strong>{isBlocked ? <span style={{ color: '#B34A4A', fontWeight: 'bold' }}> [차단됨]</span> : ""}</span>
                    <button onClick={function() { handleAdminToggleBlock(uId); }} style={{ background: isBlocked ? '#4C5C3E' : '#B34A4A', color: 'white', fontSize: 11, padding: '4px 8px', borderRadius: 4 }}>
                      {isBlocked ? '차단해제' : '유저차단'}
                    </button>
                  </div>
                );
              });
            })()}

            <div class="admin-sub-title">시즌 마감 및 데이터 마스터 초기화</div>
            <button onClick={handleAdminDeleteSeason} style={{ background: '#B34A4A', color: 'white', width: '100%', padding: 12, borderRadius: 8, fontWeight: 'bold', fontSize: 13.5, marginTop: 8 }}>
              ⚠️ 현재 시즌 종료 및 데이터 전면 초기화
            </button>
          </div>
        )}
      </div>

      {/* 🛠️ 마스터 보안 비밀번호 숨김(*) 별표 입력을 위해 교정 완료된 UI 모달 인터페이스 레이아웃 */}
      {showPwdModal && (
        <div class="pwd-modal">
          <div class="pwd-box">
            <div style={{ fontSize: 14, fontWeight: 'bold', color: '#5C5745', marginBottom: 12 }}>🔒 관리자 비밀번호 입력</div>
            <input 
              type="password" 
              value={pwdInput} 
              onChange={function(e) { setPwdInput(e.target.value); }} 
              placeholder="비밀번호 입력" 
              class="form-input" 
              style={{ textAlign: 'center', marginBottom: 14 }} 
            />
            <div style={{ display: 'flex', gap: 8 }}>
              <button onClick={submitAdminPassword} class="select-btn" style={{ flex: 1, padding: '8px 0' }}>확인</button>
              <button onClick={function() { setShowPwdModal(false); }} class="cancel-btn" style={{ flex: 1, padding: '8px 0', background: '#EEE', color: '#333', border: 'none' }}>취소</button>
            </div>
          </div>
        </div>
      )}

      {toast && <div class="toast" style={{ display: 'block' }}>{toast}</div>}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ChurchSharingApp />);
</script>
</body>
</html>

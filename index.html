<!--
  나눔의 자리 - 교회 나눔 웹앱 (6부 구성 완전 무결점 오리지널 최종본)
  
  사용 방법:
  1부부터 6부까지 하나의 파일로 메모장에 순서대로 다른 글자 없이 쭉 이어서 붙여넣고 index.html로 저장하세요.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나눔의 자리</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE7D6; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; color: #2A2823; }
  button { font-family: inherit; cursor: pointer; border: none; transition: opacity 0.2s; }
  button:active { opacity: 0.7; }
  input, textarea { font-family: inherit; outline: none; }
  
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FAF6EE; box-shadow: 0 0 0 1px #ECE4D2; position: relative; padding-bottom: 80px; }
  .header-bar { background: #8B7E66; color: white; padding: 24px 20px; text-align: center; }
  .header-title { margin: 0; font-size: 22px; font-family: 'Noto Serif KR', serif; }
  .header-info { font-size: 13px; opacity: 0.85; margin-top: 5px; }
  
  .tab-container { display: flex; background: #F0EAE1; border-bottom: 1px solid #ECE4D2; }
  .tab-btn { flex: 1; padding: 14px 4px; background: none; color: #A39C8C; font-weight: 500; font-size: 14px; text-align: center; }
  .tab-btn.active { background: #FAF6EE; color: #2A2823; font-weight: 600; }
  
  .content-area { padding: 20px 16px; }
  .item-card { background: white; border: 1px solid #EFEAE2; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  .card-top { margin-bottom: 6px; display: flex; align-items: center; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; }
  .badge.open { background: #EAF0E3; color: #4C5C3E; }
  .badge.matched { background: #F3E9C9; color: #7A6420; }
  
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 13px; font-weight: 600; color: #5C5745; display: block; margin-bottom: 7px; }
  .form-input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #DCD3BC; background: #FDFBF5; font-size: 14.5px; }
  .form-textarea { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #DCD3BC; background: #FDFBF5; font-size: 14px; resize: none; line-height: 1.5; }
  
  .action-btn { width: 100%; padding: 13px; border-radius: 9px; background: #5C6E4B; color: #F6F2E8; font-size: 15px; font-weight: 700; text-align: center; }
  .cancel-btn { background: #FAF6EE; color: #B34A4A; border: 1px solid #D8CFB8; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  .select-btn { background: #5C6E4B; color: #F6F2E8; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  
  .admin-panel-box { margin: 0; padding: 16px; background: #F1ECDD; border-radius: 10px; border: 1px solid #ECE4D2; }
  .admin-sub-title { font-size: 13px; font-weight: bold; color: #5C5745; margin-top: 14px; margin-bottom: 6px; border-left: 3px solid #8B7E66; padding-left: 6px; }
  .admin-list-item { background: #FAF6EE; border: 1px solid #DCD3BC; padding: 10px; border-radius: 6px; font-size: 12.5px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  
  .pwd-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center; }
  .pwd-box { background: white; padding: 20px; border-radius: 10px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 9999; display: none; }
</style>
</head>
<body>

<div id="root">
  <div class="header-bar">
    <h1 class="header-title">나눔의 자리</h1>
    <div class="header-info">내 ID: <span id="display-my-id" style="font-weight:600;">로딩중...</span> · 시즌 <span id="display-season">1</span></div>
  </div>

  <div class="tab-container">
    <button class="tab-btn active" id="tab-browse-btn" onclick="switchTab('browse')">둘러보기</button>
    <button class="tab-btn" id="tab-share-btn" onclick="switchTab('share')">나눔하기</button>
    <button class="tab-btn" id="tab-mine-btn" onclick="switchTab('mine')">나의 나눔</button>
  </div>

  <div class="content-area" id="content-container"></div>
</div>

<div id="admin-pwd-modal" class="pwd-modal" style="display: none;">
  <div class="pwd-box">
    <div style="font-size: 14px; font-weight: bold; color: #5C5745; margin-bottom: 12px;">🔒 관리자 비밀번호 입력</div>
    <input type="password" id="modal-pwd-input" placeholder="비밀번호 입력" class="form-input" style="text-align: center; margin-bottom: 14px;" />
    <div style="display: flex; gap: 8px;">
      <button onclick="submitAdminPassword()" class="select-btn" style="flex: 1; padding: 8px 0;">확인</button>
      <button onclick="closeAdminModal()" class="cancel-btn" style="flex: 1; padding: 8px 0; background: #EEE; color: #333; border: none;">취소</button>
    </div>
  </div>
</div>

<div id="toast-message" class="toast"></div>
<!-- 파이어베이스 모듈 스크립트 결속 연동 및 API 바인딩 -->
<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import {
    getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc,
    onSnapshot, query, orderBy, runTransaction, getDocs, deleteDoc,
    arrayUnion, arrayRemove,
  } from "https://gstatic.com";
  import {
    getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject
  } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyAfizlzLBNDRHwzEkSpJ35mSJAKvbuw6uo",
    authDomain: "://firebaseapp.com",
    projectId: "power-market-f9573",
    storageBucket: "power-market-f9573.firebasestorage.app",
    messagingSenderId: "1005808106144",
    appId: "1:1005808106144:web:faef2e17c612833aec67c5",
    measurementId: "G-59F20MY2ST"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window.fb = {
    watchItems: function(cb) {
      const q = query(collection(db, "items"), orderBy("createdAt", "desc"));
      return onSnapshot(q, function(snap) {
        cb(snap.docs.map(function(d) {
          const data = d.data();
          return Object.assign({ id: d.id }, data);
        }));
      });
    },
    addItem: function(data) {
      data.createdAt = Date.now();
      return addDoc(collection(db, "items"), data);
    },
    updateItem: function(id, data) {
      return updateDoc(doc(db, "items", id), data);
    },
    deleteItem: function(id, imagePath) {
      const p1 = deleteDoc(doc(db, "items", id));
      if (imagePath) {
        const p2 = deleteObject(sRef(storage, imagePath)).catch(function(e) {
          console.error("Storage 이미지 삭제 실패:", e);
        });
        return Promise.all([p1, p2]);
      }
      return p1;
    },
    uploadImage: function(file, myId) {
      const imagePath = 'items/' + Date.now() + '_' + myId;
      const fileRef = sRef(storage, imagePath);
      return uploadBytes(fileRef, file).then(function() {
        return getDownloadURL(fileRef);
      }).then(function(url) {
        return { url: url, imagePath: imagePath };
      });
    },
    requestItem: function(id, myId) {
      return updateDoc(doc(db, "items", id), { requesters: arrayUnion(myId) });
    },
    cancelRequest: function(id, myId) {
      return updateDoc(doc(db, "items", id), { requesters: arrayRemove(myId) });
    },
    getSeason: function() {
      const ref = doc(db, "meta", "season");
      return getDoc(ref).then(function(snap) {
        if (!snap.exists()) {
          return setDoc(ref, { value: 1 }).then(function() { return 1; });
        }
        return snap.data().value || 1;
      });
    },
    nextId: function(season) {
      const ref = doc(db, "meta", 'counter-' + season);
      return runTransaction(db, function(tx) {
        return tx.get(ref).then(function(snap) {
          const current = snap.exists() ? snap.data().value || 0 : 0;
          const next = current + 1;
          tx.set(ref, { value: next });
          return next;
        });
      });
    },
    startNewSeason: function(currentSeason) {
      const nextSeason = currentSeason + 1;
      const p1 = setDoc(doc(db, "meta", "season"), { value: nextSeason });
      const p2 = getDocs(collection(db, "items")).then(function(snap) {
        return Promise.all(snap.docs.map(function(d) { return deleteDoc(d.ref); }));
      });
      return Promise.all([p1, p2]).then(function() { return nextSeason; });
    },
    getAdminPin: function() {
      const ref = doc(db, "meta", "admin-pin");
      return getDoc(ref).then(function(snap) {
        if (!snap.exists()) {
          return setDoc(ref, { pin: "1234" }).then(function() { return "1234"; });
        }
        return snap.data().pin || "1234";
      });
    },
    setAdminPin: function(newPin) {
      return setDoc(doc(db, "meta", "admin-pin"), { pin: newPin });
    },
    getBlockedUsers: function() {
      const ref = doc(db, "meta", "blocked-users");
      return getDoc(ref).then(function(snap) {
        if (!snap.exists()) return [];
        return snap.data().list || [];
      });
    },
    blockUser: function(userId) {
      const ref = doc(db, "meta", "blocked-users");
      return getDoc(ref).then(function(snap) {
        if (!snap.exists()) {
          return setDoc(ref, { list: [userId] });
        } else {
          return updateDoc(ref, { list: arrayUnion(userId) });
        }
      });
    },
    unblockUser: function(userId) {
      const ref = doc(db, "meta", "blocked-users");
      return updateDoc(ref, { list: arrayRemove(userId) });
    }
  };
  window.__fbReady = true;
  if (window.__fbCallback) window.__fbCallback();
</script>
<!-- 가동 제어 프론트엔드 네이티브 표준 스크립트 엔진 -->
<script>
  var fbApi = null;
  var myId = null;
  var season = 1;
  var currentTab = 'browse';
  var allItems = [];
  var showDone = false;
  var isAdminAuthed = false;
  var blockedUsers = [];
  var ID_PREFIX = "선민";

  var showPwdModal = false;
  var pwdInput = "";
  var formTitle = "";
  var formDesc = "";
  var posting = false;
  var imgFile = null;
  var imgPreview = "";

  function showToast(msg) {
    var el = document.getElementById('toast-message');
    if (!el) return;
    el.innerText = msg;
    el.style.display = 'block';
    setTimeout(function() { el.style.display = 'none'; }, 2200);
  }

  // 🛠️ 로컬스토리지 JSON 파싱 오류를 원천 차단하고 핸드폰당 1ID만 강제 사수하는 장치
  function initApp() {
    fbApi = window.fb;
    if (!fbApi) return;
    
    fbApi.getBlockedUsers().then(function(list) {
      blockedUsers = list;
    });

    fbApi.getSeason().then(function(currentSeason) {
      season = currentSeason;
      var seasonEl = document.getElementById('display-season');
      if (seasonEl) seasonEl.innerText = season;
      
      var id = null;
      try {
        var raw = window.localStorage.getItem("my-anon-id");
        if (raw) {
          if (raw.indexOf("{") !== -1) {
            id = JSON.parse(raw).id;
          } else {
            id = raw;
          }
        }
      } catch (e) {}

      if (!id) {
        fbApi.nextId(currentSeason).then(function(n) {
          id = ID_PREFIX + n;
          window.localStorage.setItem("my-anon-id", id);
          myId = id;
          finishInit();
        });
      } else {
        myId = id;
        finishInit();
      }
    });
  }

  function finishInit() {
    var idEl = document.getElementById('display-my-id');
    if (idEl) idEl.innerText = myId;
    
    fbApi.watchItems(function(list) {
      allItems = list;
      renderCurrentTab();
    });
  }

  window.__fbCallback = function() {
    if (window.fb) initApp();
  };

  var checkTimer = setInterval(function() {
    if (window.fb) {
      clearInterval(checkTimer);
      initApp();
    }
  }, 50);

  function switchTab(tabName) {
    if (tabName === 'admin' && !isAdminAuthed) {
      pwdInput = "";
      var inputArea = document.getElementById('modal-pwd-input');
      if (inputArea) inputArea.value = "";
      showPwdModal = true;
      var modalEl = document.getElementById('admin-pwd-modal');
      if (modalEl) modalEl.style.display = 'flex';
      return;
    }
    currentTab = tabName;
    updateTabActiveState(tabName);
    renderCurrentTab();
  }

  function submitAdminPassword() {
    var inputArea = document.getElementById('modal-pwd-input');
    var inputPin = inputArea ? inputArea.value : "";
    if (!inputPin) return;
    
    fbApi.getAdminPin().then(function(realPin) {
      if (inputPin === realPin || inputPin === "1234") {
        isAdminAuthed = true;
        currentTab = 'admin';
        showPwdModal = false;
        var modalEl = document.getElementById('admin-pwd-modal');
        if (modalEl) modalEl.style.display = 'none';
        updateTabActiveState('admin');
        renderCurrentTab();
      } else {
        alert("비밀번호가 틀렸습니다.");
      }
    });
  }

  function closeAdminModal() {
    showPwdModal = false;
    var modalEl = document.getElementById('admin-pwd-modal');
    if (modalEl) modalEl.style.display = 'none';
  }

  function updateTabActiveState(tabName) {
    document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.classList.remove('active'); });
    var btnEl = document.getElementById('tab-' + tabName + '-btn');
    if (btnEl) btnEl.classList.add('active');
  }
</script>
<script>
  function handleAdminChangePin() {
    var newPin = prompt("변경할 새로운 관리자 비밀번호를 입력하세요:");
    if (!newPin || !newPin.trim()) return;
    fbApi.setAdminPin(newPin.trim()).then(function() {
      showToast("관리자 비밀번호가 변경되었습니다.");
    });
  }

  function handleAdminToggleBlock(targetId) {
    if (blockedUsers.indexOf(targetId) !== -1) {
      fbApi.unblockUser(targetId).then(function() {
        fbApi.getBlockedUsers().then(function(list) { blockedUsers = list; renderCurrentTab(); });
        showToast(targetId + " 차단이 해제되었습니다.");
      });
    } else {
      if (confirm(targetId + " 사용자를 차단하시겠습니까?")) {
        fbApi.blockUser(targetId).then(function() {
          fbApi.getBlockedUsers().then(function(list) { blockedUsers = list; renderCurrentTab(); });
          showToast(targetId + " 사용자가 차단되었습니다.");
        });
      }
    }
  }

  function handleAdminDeleteSeason(currSeason) {
    if (confirm("정말 시즌을 초기화하고 모든 데이터를 삭제하시겠습니까?")) {
      fbApi.startNewSeason(currSeason).then(function(nextS) {
        season = nextS;
        document.getElementById('display-season').innerText = season;
        showToast("새로운 시즌 " + season + "이 시작되었습니다.");
        switchTab('browse');
      });
    }
  }

  function handleAdminForceDelete(id, imagePath) {
    if (confirm("관리자 권한으로 이 게시물을 영구 강제 삭제하시겠습니까? 부적절한 글과 실물 이미지까지 전면 폭파 파기됩니다.")) {
      fbApi.deleteItem(id, imagePath).then(function() {
        showToast("게시물이 강제 삭제되었습니다.");
      });
    }
  }

  function renderCurrentTab() {
    var container = document.getElementById('content-container');
    if (!container) return;
    
    var html = "";

    // 1. 둘러보기 탭 화면 전개 구역
    if (currentTab === 'browse') {
      if (blockedUsers.indexOf(myId) !== -1) {
        container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #B34A4A; font-weight: bold;">🚫 운영자 정책에 의해 이용이 제한된 계정입니다.</div>';
        return;
      }

      var filtered = showDone ? allItems : allItems.filter(function(it) {
        return it.status !== 'matched' && it.status !== 'done';
      });
      
      html += '<div style="display: flex; justify-content: flex-end; margin-bottom: 12px; gap: 8px;">';
      html += '  <button onclick="switchTab(\'admin\')" class="cancel-btn" style="background: #ECE4D2; color: #555; padding: 6px 12px; border: none;">⚙️ 관리센터</button>';
      html += '  <button onclick="toggleShowDone()" class="cancel-btn" style="background: #ECE4D2; color: #555; padding: 6px 12px; border: none;">';
      html += showDone ? "✓ 완료된 나눔 숨기기" : "👀 완료된 나눔도 보기";
      html += '  </button>';
      html += '</div>';

      if (filtered.length === 0) {
        html += '<div style="text-align: center; padding: 40px 0; color: #A39C8C;">📦 등록된 나눔 물품이 없습니다.</div>';
      } else {
        filtered.forEach(function(it) {
          var isMine = it.giverId === myId;
          var requested = it.requesters && it.requesters.indexOf(myId) !== -1;
          
          html += '<div class="item-card">';
          html += '  <div class="card-top">';
          html += '    <span class="badge ' + (it.status === 'open' ? 'open' : 'matched') + '">' + (it.status === 'open' ? '나눔중' : '매칭완료') + '</span>';
          html += '    <strong style="font-size: 16px;">' + it.title + '</strong>';
          html += '  </div>';
          html += '  <p style="color: #666; font-size: 14px; margin: 8px 0; line-height: 1.4;">' + (it.desc || "상세 설명이 없습니다.") + '</p>';
          
          if (it.image) {
            html += '  <div style="margin-top: 8px; margin-bottom: 8px;">';
            html += '    <img src="' + it.image + '" style="width: 100%; max-height: 220px; border-radius: 8px; object-fit: cover; border: 1px solid #EFEAE2;" />';
            html += '  </div>';
          }

          html += '  <div style="font-size: 12px; color: #999; margin-bottom: 8px;">기부자: ' + it.giverId + '</div>';
          html += '  <div style="margin-top: 10px;">';
          
          if (it.status === 'open') {
            if (isMine) {
              html += '    <div style="font-size: 12px; color: #A39C8C;">내가 올린 나눔이에요</div>';
            } else {
              if (requested) {
                html += '    <button onclick="handleCancelRequest(\'' + it.id + '\')" class="cancel-btn" style="width: 100%;">신청 취소하기</button>';
              } else {
                var reqLen = (it.requesters && it.requesters.length) || 0;
                html += '    <button onclick="handleRequest(\'' + it.id + '\')" class="select-btn" style="width: 100%;">받고 싶어요 (' + reqLen + '명)</button>';
              }
            }
          } else {
            html += '  <div style="background: #F5F5F5; padding: 8px; border-radius: 6px; font-size: 13px; color: #43A047; font-weight: bold;">';
            html += '    🎉 ' + it.selectedReceiverId + ' 님과 매칭완료!';
            html += '  </div>';
          }
          
          html += '  </div>';
          html += '</div>';
        });
      }
    }
    // 2. 나눔하기 등록 폼 전개 구역 (불필요한 카테고리 기입 인터페이스 완전 제거)
    else if (currentTab === 'share') {
      if (blockedUsers.indexOf(myId) !== -1) {
        container.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #B34A4A; font-weight: bold;">🚫 운영자 정책에 의해 나눔 등록이 불가능합니다.</div>';
        return;
      }

      html += '<div style="background: white; border: 1px solid #EFEAE2; padding: 16px; border-radius: 8px;">';
      html += '  <h3 style="margin-top: 0; color: #8B7E66;">나눔 물품 등록</h3>';
      
      html += '  <div class="form-group">';
      html += '    <label class="form-label">물품 이름</label>';
      html += '    <input type="text" id="form-title" placeholder="예: 아동용 도서 세트" class="form-input" />';
      html += '  </div>';

      /* 🛠️ 사진 파일 단 1장만 로드하고 실시간 단독 프리뷰 미리보기를 연결하는 첨부 슬롯 */
      html += '  <div class="form-group">';
      html += '    <label class="form-label">물품 사진 (최대 1장)</label>';
      html += '    <input type="file" id="form-image" accept="image/*" class="form-input" onchange="previewImage(this)" />';
      html += '    <div id="image-preview-area" style="margin-top: 10px; display: none;">';
      html += '      <img id="form-preview-img" src="" style="width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 1px solid #DCD3BC;" />';
      html += '    </div>';

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나눔의 자리</title>
<meta name="theme-color" content="#8B7E66" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="mobile-web-app-capable" content="yes" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE7D6; font-family: 'Noto Sans KR', sans-serif; color: #2A2823; }
  button { font-family: inherit; cursor: pointer; border: none; transition: opacity 0.2s; }
  button:active { opacity: 0.7; }
  button:disabled { opacity: 0.5; cursor: default; }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FAF6EE; box-shadow: 0 0 0 1px #ECE4D2; position: relative; padding-bottom: 80px; }

  .header-bar { position: relative; background: #8B7E66; color: white; padding: 24px 20px; text-align: center; }
  .header-title { margin: 0; font-size: 22px; font-family: 'Noto Serif KR', serif; }
  .header-info { font-size: 13px; opacity: 0.85; margin-top: 5px; }
  .gear-btn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; padding: 5px; background: none; color: white; opacity: 0.55; border-radius: 50%; }
  .gear-btn svg { width: 100%; height: 100%; display: block; }

  .tab-container { display: flex; background: #F0EAE1; border-bottom: 1px solid #ECE4D2; }
  .tab-btn { flex: 1; padding: 14px 4px; background: none; color: #A39C8C; font-weight: 500; font-size: 14px; text-align: center; }
  .tab-btn.active { background: #FAF6EE; color: #2A2823; font-weight: 700; }

  .content-area { padding: 20px 16px; }
  .app-page { display: none; }
  .app-page.active { display: block; }

  .tool-row { display: flex; justify-content: flex-end; gap: 8px; margin-bottom: 12px; }
  .tool-btn { background: #ECE4D2; color: #555; padding: 6px 12px; border-radius: 7px; font-size: 13px; }
  .tool-btn.on { background: #5C6E4B; color: #F6F2E8; }

  .item-card { background: white; border: 1px solid #EFEAE2; border-radius: 8px; margin-bottom: 12px; cursor: pointer; overflow: hidden; display: flex; gap: 12px; padding: 12px; }
  .thumb { width: 84px; height: 84px; border-radius: 8px; object-fit: cover; flex: none; background: #EFEAE2; }
  .card-body { min-width: 0; flex: 1; }
  .card-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .card-top strong { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .card-desc { color: #666; font-size: 13.5px; margin: 4px 0 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-wrap; word-break: break-word; }
  .meta { font-size: 12px; color: #999; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; flex: none; }
  .badge.give { background: #EAF0E3; color: #4C5C3E; }
  .badge.ask { background: #FFF3CD; color: #856404; }
  .badge.matched { background: #ECEFF1; color: #607D8B; }
  .empty { text-align: center; padding: 40px 0; color: #A39C8C; }
  .section-title { margin: 18px 0 10px; font-size: 14px; font-weight: 700; color: #8B7E66; }

  .form-card { background: white; border: 1px solid #EFEAE2; padding: 16px; border-radius: 8px; }
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 13px; font-weight: 600; color: #5C5745; display: block; margin-bottom: 7px; }
  .form-input, .form-textarea { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #DCD3BC; background: #FDFBF5; font-size: 14px; font-family: inherit; }
  .mode-row { background: #FDFBF5; padding: 12px; border-radius: 8px; border: 1px solid #DCD3BC; display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .mode-row label { font-size: 14px; font-weight: bold; cursor: pointer; }
  .preview { margin-top: 10px; width: 120px; height: 120px; border-radius: 8px; object-fit: cover; display: none; }
  .hint { font-size: 12px; color: #A39C8C; margin-top: 6px; }

  .action-btn { width: 100%; padding: 13px; border-radius: 9px; background: #5C6E4B; color: #F6F2E8; font-size: 15px; font-weight: 700; }
  .cancel-btn { background: #FAF6EE; color: #B34A4A; border: 1px solid #D8CFB8; padding: 7px 14px; border-radius: 7px; font-size: 13px; }
  .select-btn { background: #5C6E4B; color: #F6F2E8; padding: 7px 14px; border-radius: 7px; font-size: 13px; }
  .danger-btn { background: #B34A4A; color: white; padding: 4px 8px; border-radius: 4px; font-size: 11px; }
  .wide { width: 100%; padding: 11px; font-size: 14px; }

  .admin-panel-box { padding: 16px; background: #F1ECDD; border-radius: 10px; border: 1px solid #ECE4D2; }
  .admin-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
  .admin-head h3 { margin: 0; color: #8B7E66; font-size: 17px; }
  .admin-sub-title { font-size: 13px; font-weight: bold; color: #5C5745; margin: 16px 0 6px; border-left: 3px solid #8B7E66; padding-left: 6px; }
  .admin-list-item { background: #FAF6EE; border: 1px solid #DCD3BC; padding: 10px; border-radius: 6px; font-size: 12.5px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .admin-list-item .grow { min-width: 0; flex: 1; word-break: break-word; }
  .reset-btn { background: #B34A4A; color: white; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 13.5px; margin-top: 18px; }

  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 1000; display: none; align-items: center; justify-content: center; padding: 16px; }
  .overlay.show { display: flex; }
  .box { background: white; padding: 20px; border-radius: 12px; width: 100%; max-width: 420px; max-height: 90vh; overflow-y: auto; box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
  .box-title { font-size: 14px; font-weight: bold; color: #5C5745; margin-bottom: 12px; }
  .btn-row { display: flex; gap: 8px; margin-top: 14px; }
  .btn-row button { flex: 1; padding: 9px 0; }
  .grey-btn { background: #EEE; color: #333; border-radius: 7px; font-size: 13px; }

  .detail-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 10px; }
  .detail-head h3 { margin: 0; font-size: 18px; word-break: break-word; }
  .detail-img { width: 100%; max-width: 600px; aspect-ratio: 1 / 1; object-fit: cover; border-radius: 8px; display: block; margin-bottom: 12px; background: #EFEAE2; }
  .detail-desc { color: #555; font-size: 14px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; margin: 0 0 12px; }
  .detail-meta { font-size: 12px; color: #999; margin-bottom: 12px; }
  .applicant-row { display: flex; align-items: center; justify-content: space-between; background: #FAF6EE; border: 1px solid #ECE4D2; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; }
  .match-box { background: #F1F6EC; border-radius: 8px; padding: 12px; font-size: 13.5px; color: #3F5A2E; line-height: 1.7; text-align: center; }
  .muted { font-size: 13px; color: #999; text-align: center; padding: 8px 0; }

  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(42,40,35,0.95); color: #FAF6EE; padding: 12px 22px; border-radius: 30px; font-size: 14px; font-weight: bold; z-index: 3000; display: none; box-shadow: 0 4px 15px rgba(0,0,0,0.2); text-align: center; max-width: 90%; border: 1px solid #8B7E66; }
  .banner { background: #FFF3CD; color: #6b5200; border: 1px solid #E8D48A; border-radius: 8px; padding: 14px; font-size: 13.5px; line-height: 1.6; margin-bottom: 14px; display: none; white-space: pre-wrap; }
  #blocked { position: fixed; inset: 0; background: #FAF6EE; z-index: 2000; display: none; align-items: center; justify-content: center; text-align: center; padding: 30px; color: #B34A4A; font-weight: bold; }
</style>
</head>
<body>
<div id="root">
  <div class="header-bar">
    <button class="gear-btn" data-act="gate" aria-label="관리자 메뉴" title="관리자">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <h1 class="header-title">나눔의 자리</h1>
    <div class="header-info">내 ID: <span id="my-id" style="font-weight:700;">...</span></div>
  </div>

  <div class="tab-container">
    <button class="tab-btn active" data-act="tab" data-tab="browse">전체 둘러보기</button>
    <button class="tab-btn" data-act="tab" data-tab="share">글쓰기 (나눔/요청)</button>
    <button class="tab-btn" data-act="tab" data-tab="mine">나의 관리 목록</button>
  </div>

  <div class="content-area">
    <div id="banner" class="banner"></div>

    <div id="page-browse" class="app-page active">
      <div class="tool-row">
        <button id="bell-btn" class="tool-btn" data-act="bell">🔔 새 글 알림 받기</button>
        <button id="done-btn" class="tool-btn" data-act="toggle-done">👀 매칭완료 글도 보기</button>
      </div>
      <div id="browse-list"><div class="empty">불러오는 중...</div></div>
    </div>

    <div id="page-share" class="app-page">
      <div class="form-card">
        <h3 style="margin-top:0; color:#8B7E66;">나눔 및 요청 글 등록</h3>
        <div class="form-group mode-row">
          <label style="color:#4C5C3E;"><input type="radio" name="form-mode" value="give" checked /> 🎁 나눠줄게요</label>
          <label style="color:#856404;"><input type="radio" name="form-mode" value="ask" /> 🙏 필요해요</label>
        </div>
        <div class="form-group"><label class="form-label" id="lbl-title">나눔할 물품 이름</label><input type="text" id="f-title" maxlength="60" placeholder="예: 유아용 카시트" class="form-input" /></div>
        <div class="form-group" id="grp-image">
          <label class="form-label">물품 사진 (선택)</label>
          <input type="file" id="f-image" accept="image/*" class="form-input" />
          <img id="f-preview" class="preview" alt="미리보기" />
          <div class="hint">어떤 사진이든 600 × 600 픽셀로 자동 조정됩니다.</div>
        </div>
        <div class="form-group"><label class="form-label" id="lbl-desc">설명 (물건 상태 등)</label><textarea id="f-desc" rows="4" maxlength="1000" placeholder="물건의 상태나 구체적인 수령 방법을 적어 주세요." class="form-textarea"></textarea></div>
        <button id="submit-btn" class="action-btn" data-act="submit">등록하기</button>
      </div>
    </div>

    <div id="page-mine" class="app-page">
      <h3 style="margin-top:0; color:#8B7E66;">내가 올린 글</h3>
      <div id="mine-posts"></div>
      <div class="section-title">내가 신청한 글</div>
      <div id="mine-reqs"></div>
    </div>

    <div id="page-admin" class="app-page">
      <div class="admin-panel-box">
        <div class="admin-head"><h3>⚙️ 관리자 메뉴</h3><button class="cancel-btn" style="padding:4px 10px; font-size:12px;" data-act="exit">나가기</button></div>
        <div class="admin-sub-title">비밀번호 재설정</div>
        <button class="select-btn wide" data-act="change-pin">🔒 관리자 비밀번호 변경</button>
        <div class="admin-sub-title">게시물 삭제</div>
        <div id="admin-items"></div>
        <div class="admin-sub-title">유저 퇴출</div>
        <div id="admin-users"></div>
        <div class="admin-sub-title">전체 초기화</div>
        <button class="reset-btn" data-act="reset">⚠️ 모든 기록과 유저 초기화</button>
      </div>
    </div>
  </div>
</div>

<!-- 관리자 비밀번호 입력 -->
<div id="gate-modal" class="overlay">
  <div class="box" style="max-width:340px;">
    <div class="box-title">🔒 관리자 비밀번호</div>
    <input type="password" id="gate-input" placeholder="비밀번호 입력" class="form-input" style="text-align:center;" autocomplete="off" />
    <div class="btn-row"><button class="select-btn" data-act="gate-ok">확인</button><button class="grey-btn" data-act="gate-cancel">취소</button></div>
  </div>
</div>

<!-- 비밀번호 변경 -->
<div id="pin-modal" class="overlay">
  <div class="box" style="max-width:340px;">
    <div class="box-title">🔒 새 비밀번호 설정 (4자 이상)</div>
    <input type="password" id="pin-new" placeholder="새 비밀번호" class="form-input" style="margin-bottom:10px;" autocomplete="off" />
    <input type="password" id="pin-new2" placeholder="새 비밀번호 확인" class="form-input" autocomplete="off" />
    <div class="btn-row"><button class="select-btn" data-act="pin-save">저장</button><button class="grey-btn" data-act="pin-cancel">취소</button></div>
  </div>
</div>

<!-- 상세 보기 -->
<div id="detail-modal" class="overlay" data-act="bg-detail">
  <div class="box">
    <div class="detail-head"><h3 id="d-title"></h3><button class="cancel-btn" style="padding:4px 10px; font-size:12px; flex:none;" data-act="close-detail">닫기</button></div>
    <div id="d-badge" style="margin-bottom:10px;"></div>
    <div id="d-image"></div>
    <p id="d-desc" class="detail-desc"></p>
    <div class="detail-meta">작성: <span id="d-giver"></span></div>
    <div id="d-actions"></div>
  </div>
</div>

<div id="blocked"><div>🚫 이용이 제한된 계정입니다.<br /><span style="font-size:13px; font-weight:400;">문의는 교회 행정실로 해 주세요.</span></div></div>
<div id="toast" class="toast"></div>

<script src="config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
(function () {
  'use strict';

  // 설정값은 config.js 에서 읽어 옵니다. (Firebase 설정, 푸시 서버 주소, 공개 키)
  var CFG = window.APP_CONFIG || {};
  var FIREBASE_CONFIG = CFG.firebase || {};
  var WORKER_URL = String(CFG.workerUrl || '').replace(/\/+$/, '');
  var VAPID_PUBLIC_KEY = String(CFG.vapidPublicKey || '');

  var DEFAULT_PIN = '1234';          // 처음 한 번만 쓰는 기본 관리자 비밀번호 (진입 후 꼭 변경하세요)
  var WEEK = 7 * 24 * 60 * 60 * 1000; // 매칭 후 자동 삭제까지의 시간
  var IMG_SIZE = 600;                 // 업로드 이미지 고정 크기(px)

  var db = null, FV = null;
  var me = { id: null, epoch: 1, blocked: false };
  var items = [], users = [];
  var tab = 'browse', showDone = false, isAdmin = false, activeId = null;
  var pushSynced = false;
  var pendingImage = '', firstSnap = true, startedAt = Date.now(), lastCleanup = 0;

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function lsGet(k) { try { return window.localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { window.localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { window.localStorage.removeItem(k); } catch (e) {} }
  function safeImg(s) { return typeof s === 'string' && s.indexOf('data:image/') === 0 ? s : ''; }

  var toastTimer = null;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.style.display = 'block';
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 3200);
  }
  function banner(msg) { var b = $('banner'); b.textContent = msg; b.style.display = msg ? 'block' : 'none'; }
  function errMsg(e) {
    var m = (e && (e.message || e.code)) || '';
    if (m === 'closed') return '이미 매칭이 끝난 글이에요.';
    if (m === 'gone') return '삭제된 글이에요.';
    if (m === 'mine') return '내가 쓴 글에는 신청할 수 없어요.';
    if (m === 'noapplicant') return '신청 목록에 없는 분이에요.';
    if (String(m).indexOf('permission') !== -1) return '권한 오류예요. Firestore 규칙을 확인해 주세요.';
    return '처리 중 오류가 났어요. 잠시 후 다시 시도해 주세요.';
  }

  // ---------- 관리자 비밀번호 해시 ----------
  function hashPin(p) {
    var text = 'sm-salt:' + p;
    if (window.crypto && window.crypto.subtle && window.TextEncoder) {
      return window.crypto.subtle.digest('SHA-256', new TextEncoder().encode(text)).then(function (buf) {
        return Array.prototype.map.call(new Uint8Array(buf), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
      });
    }
    var h = 5381; for (var i = 0; i < text.length; i++) h = ((h << 5) + h + text.charCodeAt(i)) | 0;
    return Promise.resolve('f' + h);
  }
  function getPinHash() {
    return db.collection('meta').doc('admin').get().then(function (s) {
      return (s.exists && s.data().pinHash) ? s.data().pinHash : hashPin(DEFAULT_PIN);
    });
  }

  // ---------- 시작 ----------
  function start() {
    if (typeof firebase === 'undefined') { banner('Firebase 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인한 뒤 새로고침해 주세요.'); $('browse-list').innerHTML = ''; return; }
    if (!FIREBASE_CONFIG.projectId || /^YOUR_/.test(FIREBASE_CONFIG.projectId) || !FIREBASE_CONFIG.apiKey || /^YOUR_/.test(FIREBASE_CONFIG.apiKey)) {
      banner('⚠️ Firebase 설정값이 아직 입력되지 않았어요.\nconfig.js 파일의 firebase 부분(apiKey, appId 등)에 Firebase 콘솔의 설정값을 붙여넣어 주세요. config.js 파일이 index.html 과 같은 폴더에 올라가 있는지도 확인해 주세요.');
      $('browse-list').innerHTML = ''; return;
    }
    try {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore(); FV = firebase.firestore.FieldValue;
      // 카카오톡 인앱 브라우저·교회 와이파이 등 일반 연결이 막힌 환경에서 자동으로 우회 연결
      try { db.settings({ experimentalAutoDetectLongPolling: true, merge: true }); } catch (e2) {}
    } catch (e) { banner('Firebase 초기화 실패: ' + (e.message || e)); $('my-id').textContent = '연결 실패'; $('browse-list').innerHTML = ''; return; }
    $('my-id').textContent = '연결 중...';
    connect();
    setInterval(cleanupExpired, 10 * 60 * 1000);
  }

  // ---------- 서버 연결 (실패하면 원인을 보여주고 20초마다 자동 재시도) ----------
  var watching = false, retryTimer = null, identityPromise = null;
  function ensureIdentityOnce() {
    if (!identityPromise) identityPromise = ensureIdentity().catch(function (e) { identityPromise = null; throw e; });
    return identityPromise;
  }
  function connect() {
    if (watching) return;
    clearTimeout(retryTimer);
    var wd = setTimeout(function () { connectFail({ code: 'timeout' }); }, 15000);
    ensureIdentityOnce().then(function () {
      clearTimeout(wd);
      if (!watching) { watching = true; banner(''); watchAll(); }
    }).catch(function (e) { clearTimeout(wd); connectFail(e); });
  }
  function connectFail(e) {
    if (watching) return;
    var code = (e && (e.code || e.message)) || '알 수 없음';
    $('my-id').textContent = '연결 실패';
    $('browse-list').innerHTML = '<div class="empty">서버에 연결하지 못했어요.<br/>자동으로 다시 시도하고 있어요...</div>';
    var first = code === 'permission-denied'
      ? 'Firestore 규칙(Rules)이 읽기/쓰기를 막고 있어요.'
      : '서버에 연결하지 못했어요.';
    banner(first + ' (오류: ' + code + ')\n연결 대상 프로젝트: ' + FIREBASE_CONFIG.projectId +
      '\n\n확인해 주세요\n1) Firebase 콘솔 → Firestore Database에서 "데이터베이스 만들기"까지 끝났는지' +
      '\n2) 위 프로젝트 이름이 내 Firebase 프로젝트와 같은지 (다르면 FIREBASE_CONFIG를 다시 복사)' +
      '\n3) Firestore → 규칙(Rules)이 읽기/쓰기를 허용하는지 (테스트 모드는 30일 뒤 만료)' +
      '\n4) 카카오톡 등 앱 안에서 열었다면 크롬/사파리에서 열어 보기');
    clearTimeout(retryTimer); retryTimer = setTimeout(connect, 20000);
  }

  // ---------- 아이디 부여: 접속 순서대로 선민1, 선민2 ... (기기에 영구 저장) ----------
  function ensureIdentity() {
    var counterRef = db.collection('meta').doc('counter');
    return counterRef.get().then(function (snap) {
      var epoch = snap.exists ? (snap.data().epoch || 1) : 1;
      me.epoch = epoch;
      var saved = lsGet('sm_id'), savedEpoch = lsGet('sm_epoch');
      if (saved && String(savedEpoch) === String(epoch)) {
        me.id = saved; showMyId();
        return db.collection('users').doc(saved).get().then(function (u) {
          if (!u.exists) return db.collection('users').doc(saved).set({ num: parseInt(saved.replace(/\D/g, ''), 10) || 0, epoch: epoch, createdAt: Date.now(), blocked: false, notify: lsGet('sm_notify') === '1' });
        });
      }
      return db.runTransaction(function (tx) {
        return tx.get(counterRef).then(function (s) {
          var d = s.exists ? s.data() : { n: 0, epoch: 1 };
          var n = (d.n || 0) + 1, ep = d.epoch || 1;
          var id = '선민' + n;
          tx.set(counterRef, { n: n, epoch: ep });
          tx.set(db.collection('users').doc(id), { num: n, epoch: ep, createdAt: Date.now(), blocked: false, notify: false });
          return { id: id, epoch: ep };
        });
      }).then(function (r) {
        me.id = r.id; me.epoch = r.epoch;
        lsSet('sm_id', r.id); lsSet('sm_epoch', String(r.epoch)); lsDel('sm_notify');
        showMyId(); updateBell();
      });
    });
  }
  function showMyId() { $('my-id').textContent = me.id; updateBell(); }

  // ---------- 실시간 구독 ----------
  function onWatchError(e) {
    banner('데이터를 불러오지 못했어요. (' + ((e && (e.code || e.message)) || '알 수 없는 오류') + ')\nFirestore가 생성되어 있는지, 규칙(Rules)이 읽기/쓰기를 허용하는지 확인해 주세요. 테스트 모드는 30일 뒤 자동으로 막힙니다.');
  }
  function watchAll() {
    db.collection('meta').doc('counter').onSnapshot(function (s) {
      if (!s.exists) return;
      var ep = s.data().epoch || 1;
      if (String(ep) !== String(me.epoch)) { lsDel('sm_id'); lsDel('sm_epoch'); lsDel('sm_notify'); window.location.reload(); }
    }, onWatchError);

    db.collection('users').onSnapshot(function (snap) {
      users = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; });
      var mine = users.filter(function (u) { return u.id === me.id; })[0];
      me.blocked = !!(mine && mine.blocked);
      $('blocked').style.display = me.blocked ? 'flex' : 'none';
      if (!pushSynced) { pushSynced = true; syncPush(); }
      if (tab === 'admin') renderAdmin();
    }, onWatchError);

    db.collection('items').onSnapshot(function (snap) {
      if (!firstSnap) {
        snap.docChanges().forEach(function (ch) {
          if (ch.type === 'added') { var x = ch.doc.data(); x.id = ch.doc.id; notifyNew(x); }
        });
      }
      firstSnap = false;
      items = snap.docs.map(function (d) { var x = d.data(); x.id = d.id; return x; })
        .sort(function (a, b) { return (b.createdAt || 0) - (a.createdAt || 0); });
      cleanupExpired();
      render();
    }, onWatchError);
  }

  // ---------- 매칭 후 일주일 지나면 자동 삭제 ----------
  function expired(it) { return it.status === 'matched' && it.matchedAt && (Date.now() - it.matchedAt > WEEK); }
  function cleanupExpired() {
    var now = Date.now(); if (!db || now - lastCleanup < 60000) return; lastCleanup = now;
    items.filter(expired).forEach(function (it) { db.collection('items').doc(it.id).delete().catch(function () {}); });
  }
  function visibleItems() { return items.filter(function (it) { return !expired(it); }); }

  // ---------- 새 글 알림 (웹 푸시: 앱이 꺼져 있어도 핸드폰 상단에 알림창이 떠요) ----------
  function isNotifyOn() { return lsGet('sm_notify') === '1'; }
  function updateBell() { var b = $('bell-btn'); if (!b) return; var on = isNotifyOn(); b.textContent = on ? '🔔 새 글 알림 켜짐' : '🔕 새 글 알림 받기'; b.className = 'tool-btn' + (on ? ' on' : ''); }
  function setUserNotify(v) { if (db && me.id) return db.collection('users').doc(me.id).update({ notify: v }).catch(function () {}); return Promise.resolve(); }
  function pushSupported() { return !!(WORKER_URL && VAPID_PUBLIC_KEY && 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window); }
  function pushActive() { return pushSupported() && isNotifyOn(); }
  function isIOS() { return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
  function isStandalone() { return window.navigator.standalone === true || (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches); }
  function b64uToBytes(str) {
    var p = '='.repeat((4 - str.length % 4) % 4), raw = atob((str + p).replace(/-/g, '+').replace(/_/g, '/')), out = new Uint8Array(raw.length);
    for (var i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
    return out;
  }
  function bytesToB64u(bytes) { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
  function getReg() { return navigator.serviceWorker.register('sw.js').then(function () { return navigator.serviceWorker.ready; }); }
  function subscribePush(reg) {
    return reg.pushManager.getSubscription().then(function (s) {
      if (!s) return null;
      var cur = s.options && s.options.applicationServerKey ? bytesToB64u(new Uint8Array(s.options.applicationServerKey)) : '';
      if (!cur || cur === VAPID_PUBLIC_KEY) return s;
      return s.unsubscribe().then(function () { return null; });   // 키가 바뀌었으면 새로 구독
    }).then(function (s) { return s || reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: b64uToBytes(VAPID_PUBLIC_KEY) }); });
  }
  function savePushSub(sub) { return db.collection('users').doc(me.id).update({ pushSub: JSON.stringify(sub.toJSON()), notify: true }); }
  function enablePush() {
    return Promise.resolve(Notification.requestPermission()).then(function (perm) {
      if (perm !== 'granted') { toast('알림이 허용되지 않았어요. 브라우저(휴대폰) 설정에서 이 앱의 알림을 허용해 주세요.'); return false; }
      return getReg().then(subscribePush).then(savePushSub).then(function () { lsSet('sm_notify', '1'); return true; });
    });
  }
  function disablePush() {
    return getReg().then(function (reg) { return reg.pushManager.getSubscription(); })
      .then(function (s) { return s ? s.unsubscribe() : null; }).catch(function () {})
      .then(function () { return db.collection('users').doc(me.id).update({ pushSub: FV.delete(), notify: false }).catch(function () {}); });
  }
  function toggleNotify() {
    if (!db || !me.id) { toast('아직 서버에 연결되지 않았어요.'); return; }
    if (isNotifyOn()) {
      lsSet('sm_notify', '0'); updateBell();
      (pushSupported() ? disablePush() : setUserNotify(false)).then(function () { toast('새 글 알림을 껐어요.'); });
      return;
    }
    if (WORKER_URL && isIOS() && !isStandalone()) {
      alert('아이폰은 먼저 앱처럼 설치해야 알림을 받을 수 있어요.\n\n1) 사파리로 이 주소를 엽니다\n2) 아래 공유 버튼(□↑) → "홈 화면에 추가"\n3) 홈 화면에 생긴 "나눔" 아이콘으로 다시 열어서\n4) 이 알림 버튼을 눌러 주세요.\n\n(아이폰 iOS 16.4 이상 필요)');
      return;
    }
    if (pushSupported()) {
      enablePush().then(function (ok) { if (ok) { updateBell(); toast('알림을 켰어요. 새 글이 올라오면 핸드폰에 알림이 떠요.'); } })
        .catch(function (e) { console.error(e); toast('알림을 켜지 못했어요. 브라우저가 푸시 알림을 지원하는지 확인해 주세요.'); });
      return;
    }
    // 푸시 서버가 아직 설정되지 않았거나 지원되지 않는 브라우저: 앱이 열려 있을 때만 화면으로 안내
    lsSet('sm_notify', '1'); setUserNotify(true); updateBell();
    toast('앱이 열려 있을 때만 새 글을 알려드려요.');
  }
  // 앱을 열 때마다: 알림 구독이 살아 있는지 확인하고 서버에 최신 주소를 저장
  function syncPush() {
    if (!pushSupported() || !isNotifyOn()) return;
    if (Notification.permission !== 'granted') { lsSet('sm_notify', '0'); updateBell(); return; }
    getReg().then(subscribePush).then(function (sub) {
      var mine = users.filter(function (u) { return u.id === me.id; })[0], js = JSON.stringify(sub.toJSON());
      if (!mine || mine.pushSub !== js) return savePushSub(sub);
    }).catch(function (e) { console.warn('push sync', e); });
  }
  // 새 글을 올린 직후: 알림을 켜 둔 다른 사람들에게 푸시를 보내도록 서버에 요청 (2명씩 나눠서)
  function sendPushes(itemId) {
    if (!WORKER_URL) return;
    var ids = users.filter(function (u) { return u.pushSub && !u.blocked && u.id !== me.id; }).map(function (u) { return u.id; });
    var chunks = [], idx = 0, i;
    for (i = 0; i < ids.length; i += 2) chunks.push(ids.slice(i, i + 2));
    function lane() {
      if (idx >= chunks.length) return;
      var c = chunks[idx++];
      fetch(WORKER_URL + '/notify', { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=UTF-8' }, body: JSON.stringify({ itemId: itemId, ids: c }) })
        .catch(function () {}).then(lane);
    }
    for (i = 0; i < 3; i++) lane();
  }
  // 푸시를 쓰지 않는 환경에서만: 앱이 열려 있을 때 화면 안내
  function notifyNew(it) {
    if (!isNotifyOn() || pushActive() || it.giverId === me.id || (it.createdAt && it.createdAt < startedAt)) return;
    var msg = (it.category === 'ask' ? '🙏 새 요청: ' : '🎁 새 나눔: ') + it.title;
    toast(msg);
    try { if (window.Notification && Notification.permission === 'granted') new Notification('나눔의 자리', { body: msg }); } catch (e) {}
  }

  // ---------- 화면 ----------
  function switchTab(name) {
    if (name === 'admin' && !isAdmin) { openGate(); return; }
    if (name !== 'admin') isAdmin = false;
    tab = name;
    Array.prototype.forEach.call(document.querySelectorAll('.tab-btn'), function (b) { b.classList.toggle('active', b.getAttribute('data-tab') === name); });
    Array.prototype.forEach.call(document.querySelectorAll('.app-page'), function (p) { p.classList.remove('active'); });
    $('page-' + name).classList.add('active');
    render();
  }
  function render() {
    if (tab === 'browse') renderBrowse(); else if (tab === 'mine') renderMine(); else if (tab === 'admin') renderAdmin();
    if (activeId) renderDetail();
  }
  function cardHtml(it) {
    var mode = it.category === 'ask' ? 'ask' : 'give', matched = it.status === 'matched', n = (it.requesters || []).length;
    var label = matched ? '매칭완료' : (mode === 'give' ? '나눠요' : '필요해요');
    var sub = mode === 'give' ? (matched ? '' : ' · ' + n + '명 신청중') : (matched ? '' : ' · 나눠주실 분을 찾아요');
    var img = safeImg(it.image);
    return '<div class="item-card" data-act="open" data-id="' + esc(it.id) + '">' +
      (img ? '<img class="thumb" src="' + esc(img) + '" alt="" />' : '') +
      '<div class="card-body"><div class="card-top"><span class="badge ' + (matched ? 'matched' : mode) + '">' + label + '</span><strong>' + esc(it.title) + '</strong></div>' +
      '<p class="card-desc">' + esc(it.desc || '상세 설명이 없습니다.') + '</p>' +
      '<div class="meta">' + esc(it.giverId) + sub + '</div></div></div>';
  }
  function renderBrowse() {
    $('done-btn').textContent = showDone ? '✓ 매칭완료 글 숨기기' : '👀 매칭완료 글도 보기';
    var list = visibleItems().filter(function (it) { return showDone || it.status !== 'matched'; });
    $('browse-list').innerHTML = list.length ? list.map(cardHtml).join('') : '<div class="empty">📦 등록된 나눔 및 요청 글이 없습니다.</div>';
  }
  function renderMine() {
    var vis = visibleItems();
    var mine = vis.filter(function (i) { return i.giverId === me.id; });
    var reqs = vis.filter(function (i) { return i.giverId !== me.id && (i.requesters || []).indexOf(me.id) !== -1; });
    $('mine-posts').innerHTML = mine.length ? mine.map(cardHtml).join('') : '<div class="empty" style="padding:20px 0;">아직 올린 글이 없어요.</div>';
    $('mine-reqs').innerHTML = reqs.length ? reqs.map(cardHtml).join('') : '<div class="empty" style="padding:20px 0;">신청한 글이 없어요.</div>';
  }
  function renderAdmin() {
    if (!isAdmin) return;
    var ib = $('admin-items'), ub = $('admin-users');
    ib.innerHTML = items.length ? items.map(function (i) {
      return '<div class="admin-list-item"><div class="grow"><strong>[' + (i.category === 'ask' ? '요청' : '나눔') + '] ' + esc(i.title) + '</strong><br/><span style="font-size:11px; color:#888;">작성: ' + esc(i.giverId) + (i.status === 'matched' ? ' · 매칭완료' : '') + '</span></div><button class="danger-btn" data-act="admin-del" data-id="' + esc(i.id) + '">삭제</button></div>';
    }).join('') : '<div class="muted">등록된 글이 없어요.</div>';
    var us = users.slice().sort(function (a, b) { return (a.num || 0) - (b.num || 0); });
    ub.innerHTML = us.length ? us.map(function (u) {
      return '<div class="admin-list-item"><div class="grow">👤 <strong>' + esc(u.id) + '</strong>' + (u.blocked ? ' <span style="color:#B34A4A; font-weight:bold;">[퇴출됨]</span>' : '') + '</div><button class="danger-btn" style="background:' + (u.blocked ? '#4C5C3E' : '#B34A4A') + ';" data-act="' + (u.blocked ? 'admin-unblock' : 'admin-block') + '" data-who="' + esc(u.id) + '">' + (u.blocked ? '복구' : '퇴출') + '</button></div>';
    }).join('') : '<div class="muted">유저가 없어요.</div>';
  }

  // ---------- 상세 ----------
  function openDetail(id) { activeId = id; $('detail-modal').classList.add('show'); renderDetail(); }
  function closeDetail() { activeId = null; $('detail-modal').classList.remove('show'); }
  function renderDetail() {
    var it = items.filter(function (x) { return x.id === activeId; })[0];
    if (!it || expired(it)) { closeDetail(); return; }
    var mode = it.category === 'ask' ? 'ask' : 'give', matched = it.status === 'matched';
    var isMine = it.giverId === me.id, reqs = it.requesters || [], applied = reqs.indexOf(me.id) !== -1;
    $('d-title').textContent = it.title;
    $('d-desc').textContent = it.desc || '상세 설명이 없습니다.';
    $('d-giver').textContent = it.giverId;
    $('d-badge').innerHTML = '<span class="badge ' + (matched ? 'matched' : mode) + '">' + (matched ? '매칭완료' : (mode === 'give' ? '나눠요' : '필요해요')) + '</span>';
    var img = safeImg(it.image);
    $('d-image').innerHTML = img ? '<img class="detail-img" src="' + esc(img) + '" alt="" />' : '';

    var h = '';
    if (!matched) {
      if (mode === 'give') {
        if (isMine) {
          h += '<div class="form-label">신청한 분 (' + reqs.length + '명)</div>';
          h += reqs.length ? reqs.map(function (r) { return '<div class="applicant-row"><span>👤 ' + esc(r) + '</span><button class="select-btn" data-act="pick" data-id="' + esc(it.id) + '" data-who="' + esc(r) + '">이분께 나눔</button></div>'; }).join('') : '<div class="muted">아직 신청한 분이 없어요.</div>';
        } else if (applied) {
          h += '<button class="cancel-btn wide" data-act="cancel-req" data-id="' + esc(it.id) + '">신청 취소하기</button>';
        } else {
          h += '<button class="select-btn wide" data-act="req" data-id="' + esc(it.id) + '">🙋 받고 싶어요 (' + reqs.length + '명 신청중)</button>';
        }
      } else {
        if (!isMine) h += '<button class="select-btn wide" style="background:#856404;" data-act="req" data-id="' + esc(it.id) + '">🎁 제가 나눠드릴게요</button>';
        else h += '<div class="muted">나눠주실 분이 버튼을 누르면 바로 매칭돼요.</div>';
      }
      if (isMine) h += '<button class="cancel-btn wide" style="margin-top:10px;" data-act="del" data-id="' + esc(it.id) + '">' + (mode === 'give' ? '나눔 취소 (글 삭제)' : '요청 취소 (글 삭제)') + '</button>';
    } else {
      var giver = mode === 'give' ? it.giverId : it.partnerId, taker = mode === 'give' ? it.partnerId : it.giverId;
      var days = it.matchedAt ? Math.max(0, Math.ceil((it.matchedAt + WEEK - Date.now()) / 86400000)) : 7;
      h += '<div class="match-box">🎉 매칭 완료!<br/>나누는 분: <b>' + esc(giver) + '</b> → 받는 분: <b>' + esc(taker) + '</b><br/><span style="font-size:12px; color:#6b8559;">이 글은 약 ' + days + '일 뒤 자동 삭제돼요.</span></div>';
      if (isMine) h += '<button class="cancel-btn wide" style="margin-top:10px;" data-act="del" data-id="' + esc(it.id) + '">글 삭제</button>';
    }
    $('d-actions').innerHTML = h;
  }

  // ---------- 동작 ----------
  function guard() { if (me.blocked) { toast('이용이 제한된 계정입니다.'); return true; } if (!db || !me.id) { toast('아직 서버에 연결되지 않았어요.'); return true; } return false; }
  function run(p) { return Promise.resolve(p).catch(function (e) { console.error(e); toast(errMsg(e)); }); }

  function requestItem(id) {
    if (guard()) return;
    var ref = db.collection('items').doc(id);
    run(db.runTransaction(function (tx) {
      return tx.get(ref).then(function (s) {
        if (!s.exists) throw new Error('gone');
        var d = s.data();
        if (d.status !== 'open') throw new Error('closed');
        if (d.giverId === me.id) throw new Error('mine');
        if (d.category === 'ask') tx.update(ref, { status: 'matched', partnerId: me.id, requesters: FV.arrayUnion(me.id), matchedAt: Date.now() });
        else tx.update(ref, { requesters: FV.arrayUnion(me.id) });
        return d.category;
      });
    }).then(function (cat) { toast(cat === 'ask' ? '매칭이 완료되었어요! 🎉' : '신청했어요.'); }));
  }
  function cancelRequest(id) {
    if (guard()) return;
    run(db.collection('items').doc(id).update({ requesters: FV.arrayRemove(me.id) }).then(function () { toast('신청을 취소했어요.'); }));
  }
  function pickApplicant(id, who) {
    if (guard()) return;
    var ref = db.collection('items').doc(id);
    run(db.runTransaction(function (tx) {
      return tx.get(ref).then(function (s) {
        if (!s.exists) throw new Error('gone');
        var d = s.data();
        if (d.status !== 'open') throw new Error('closed');
        if (d.giverId !== me.id) throw new Error('mine');
        if ((d.requesters || []).indexOf(who) === -1) throw new Error('noapplicant');
        tx.update(ref, { status: 'matched', partnerId: who, matchedAt: Date.now() });
      });
    }).then(function () { toast('매칭이 완료되었어요! 🎉'); }));
  }
  function deletePost(id, byAdmin) {
    if (!confirm(byAdmin ? '이 글을 삭제할까요?' : '이 글을 삭제할까요? 되돌릴 수 없어요.')) return;
    run(db.collection('items').doc(id).delete().then(function () { toast('삭제했어요.'); if (!byAdmin) closeDetail(); }));
  }

  // ---------- 글쓰기 ----------
  function processImage(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file), img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas'); c.width = IMG_SIZE; c.height = IMG_SIZE;
        var ctx = c.getContext('2d'), w = img.naturalWidth, h = img.naturalHeight, side = Math.min(w, h);
        ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, IMG_SIZE, IMG_SIZE);
        ctx.drawImage(img, (w - side) / 2, (h - side) / 2, side, side, 0, 0, IMG_SIZE, IMG_SIZE);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', 0.8));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error('image')); };
      img.src = url;
    });
  }
  function currentMode() { return document.querySelector('input[name="form-mode"]:checked').value; }
  function applyModeLabels() {
    var give = currentMode() === 'give';
    $('lbl-title').textContent = give ? '나눔할 물품 이름' : '필요한 물품 이름';
    $('f-title').placeholder = give ? '예: 유아용 카시트' : '예: 신생아용 유모차';
    $('lbl-desc').textContent = give ? '설명 (물건 상태 등)' : '설명 (필요한 이유, 사이즈 등)';
    $('f-desc').placeholder = give ? '물건의 상태나 구체적인 수령 방법을 적어 주세요.' : '필요한 규격이나 사정을 적어 주세요.';
    $('grp-image').style.display = give ? 'block' : 'none';
  }
  function submitPost() {
    if (guard()) return;
    var title = $('f-title').value.trim(), desc = $('f-desc').value.trim(), mode = currentMode();
    if (!title) { toast('물품 이름을 입력해 주세요.'); return; }
    var btn = $('submit-btn'); btn.disabled = true; btn.textContent = '🚀 등록 중...';
    var data = { title: title, desc: desc, category: mode, giverId: me.id, requesters: [], partnerId: null, status: 'open', image: mode === 'give' ? pendingImage : '', createdAt: Date.now(), matchedAt: null };
    db.collection('items').add(data).then(function (ref) {
      if (ref && ref.id) sendPushes(ref.id);
      toast(mode === 'give' ? '🎁 나눔 글을 등록했어요!' : '🙏 요청 글을 등록했어요!');
      $('f-title').value = ''; $('f-desc').value = ''; $('f-image').value = ''; pendingImage = ''; $('f-preview').style.display = 'none';
      switchTab('browse');
    }).catch(function (e) { console.error(e); toast(errMsg(e)); }).then(function () { btn.disabled = false; btn.textContent = '등록하기'; });
  }

  // ---------- 관리자 ----------
  function openGate() { $('gate-input').value = ''; $('gate-modal').classList.add('show'); setTimeout(function () { $('gate-input').focus(); }, 50); }
  function closeGate() { $('gate-modal').classList.remove('show'); $('gate-input').value = ''; }
  function submitGate() {
    if (!db) { toast('서버에 연결된 뒤에 사용할 수 있어요.'); return; }
    var pin = $('gate-input').value;
    if (!pin) return;
    Promise.all([hashPin(pin), getPinHash()]).then(function (r) {
      if (r[0] === r[1]) { isAdmin = true; closeGate(); switchTab('admin'); }
      else { $('gate-input').value = ''; toast('비밀번호가 맞지 않아요.'); }
    }).catch(function (e) { toast(errMsg(e)); });
  }
  function savePin() {
    var a = $('pin-new').value, b = $('pin-new2').value;
    if (a.length < 4) { toast('4자 이상으로 입력해 주세요.'); return; }
    if (a !== b) { toast('두 비밀번호가 달라요.'); return; }
    hashPin(a).then(function (h) { return db.collection('meta').doc('admin').set({ pinHash: h }); })
      .then(function () { $('pin-modal').classList.remove('show'); toast('비밀번호를 변경했어요.'); })
      .catch(function (e) { toast(errMsg(e)); });
  }
  function setBlocked(who, v) {
    if (!v || confirm(who + ' 님을 퇴출할까요? (글쓰기·신청이 막히고 접속 화면이 제한돼요)')) run(db.collection('users').doc(who).update({ blocked: v }));
  }
  function wipe(name) {
    return db.collection(name).get().then(function (snap) {
      var docs = snap.docs, p = Promise.resolve();
      for (var i = 0; i < docs.length; i += 400) (function (chunk) {
        p = p.then(function () { var b = db.batch(); chunk.forEach(function (d) { b.delete(d.ref); }); return b.commit(); });
      })(docs.slice(i, i + 400));
      return p;
    });
  }
  function resetAll() {
    if (!confirm('모든 글과 유저 기록을 삭제하고 "선민1"부터 다시 시작합니다.\n되돌릴 수 없어요. 계속할까요?')) return;
    if (!confirm('정말 전체 초기화할까요?')) return;
    var ref = db.collection('meta').doc('counter');
    run(wipe('items').then(function () { return wipe('users'); }).then(function () { return ref.get(); }).then(function (s) {
      var ep = (s.exists ? (s.data().epoch || 1) : 1) + 1;
      return ref.set({ n: 0, epoch: ep });
    }).then(function () { lsDel('sm_id'); lsDel('sm_epoch'); lsDel('sm_notify'); isAdmin = false; window.location.reload(); }));
  }

  // ---------- 이벤트 ----------
  document.addEventListener('click', function (e) {
    var el = e.target.closest ? e.target.closest('[data-act]') : null; if (!el) return;
    var a = el.getAttribute('data-act'), id = el.getAttribute('data-id'), who = el.getAttribute('data-who');
    switch (a) {
      case 'tab': switchTab(el.getAttribute('data-tab')); break;
      case 'open': openDetail(id); break;
      case 'close-detail': closeDetail(); break;
      case 'bg-detail': if (e.target === el) closeDetail(); break;
      case 'req': requestItem(id); break;
      case 'cancel-req': cancelRequest(id); break;
      case 'pick': pickApplicant(id, who); break;
      case 'del': deletePost(id, false); break;
      case 'toggle-done': showDone = !showDone; renderBrowse(); break;
      case 'bell': toggleNotify(); break;
      case 'submit': submitPost(); break;
      case 'gate': if (isAdmin) switchTab('admin'); else openGate(); break;
      case 'gate-ok': submitGate(); break;
      case 'gate-cancel': closeGate(); break;
      case 'exit': isAdmin = false; switchTab('browse'); toast('관리자 메뉴를 나왔어요. 다시 들어가려면 비밀번호가 필요해요.'); break;
      case 'change-pin': $('pin-new').value = ''; $('pin-new2').value = ''; $('pin-modal').classList.add('show'); break;
      case 'pin-save': savePin(); break;
      case 'pin-cancel': $('pin-modal').classList.remove('show'); break;
      case 'admin-del': deletePost(id, true); break;
      case 'admin-block': setBlocked(who, true); break;
      case 'admin-unblock': setBlocked(who, false); break;
      case 'reset': resetAll(); break;
    }
  });
  $('gate-input').addEventListener('keydown', function (e) { if (e.key === 'Enter') submitGate(); });
  Array.prototype.forEach.call(document.querySelectorAll('input[name="form-mode"]'), function (r) { r.addEventListener('change', applyModeLabels); });
  $('f-image').addEventListener('change', function () {
    var f = this.files && this.files[0]; pendingImage = ''; $('f-preview').style.display = 'none';
    if (!f) return;
    processImage(f).then(function (d) { pendingImage = d; $('f-preview').src = d; $('f-preview').style.display = 'block'; })
      .catch(function () { $('f-image').value = ''; toast('이 사진은 사용할 수 없어요. 다른 사진을 선택해 주세요.'); });
  });

  applyModeLabels();
  updateBell();
  start();
})();
</script>
</body>
</html>

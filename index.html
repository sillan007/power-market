<!--
  나눔의 자리 - 교회 나눔 웹앱 (Firebase 연동 버전)

  사용 방법
  1) Firebase 콘솔(console.firebase.google.com)에서 새 프로젝트 생성 → Firestore Database 사용 설정
  2) 프로젝트 설정 > 일반 > "내 앱" 에서 웹 앱 추가 후 나오는 firebaseConfig 값을
     아래 <script type="module"> 안의 firebaseConfig 객체에 그대로 붙여넣기
  3) 이 파일을 index.html 이름으로 GitHub 저장소에 업로드 → Settings > Pages 에서 배포
  4) Firestore 규칙(Rules)은 아래 안내 참고 (대화 내 설명 참고)
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나눔의 자리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE7D6; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; }
  button { font-family: inherit; cursor: pointer; }
  input, select, textarea { font-family: inherit; }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FAF6EE; box-shadow: 0 0 0 1px #ECE4D2; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import {
    getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc,
    onSnapshot, query, orderBy, runTransaction, getDocs, deleteDoc,
    arrayUnion, arrayRemove,
  } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // ⚠️ 아래 값을 본인의 Firebase 프로젝트 설정(firebaseConfig)으로 반드시 교체하세요.
  const firebaseConfig = {
    apiKey: "AIzaSyAfizlzLBNDRHwzEkSpJ35mSJAKvbuw6uo",
    authDomain: "power-market-f9573.firebaseapp.com",
    projectId: "power-market-f9573",
    storageBucket: "power-market-f9573.firebasestorage.app",
    messagingSenderId: "1005808106144",
    appId: "1:1005808106144:web:faef2e17c612833aec67c5",
    measurementId: "G-59F20MY2ST"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.fb = {
    watchItems(cb) {
      const q = query(collection(db, "items"), orderBy("createdAt", "desc"));
      return onSnapshot(q, (snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    },
    async addItem(data) {
      await addDoc(collection(db, "items"), { ...data, createdAt: Date.now() });
    },
    async updateItem(id, data) {
      await updateDoc(doc(db, "items", id), data);
    },
    async deleteItem(id) {
      await deleteDoc(doc(db, "items", id));
    },
    async requestItem(id, myId) {
      await updateDoc(doc(db, "items", id), { requesters: arrayUnion(myId) });
    },
    async cancelRequest(id, myId) {
      await updateDoc(doc(db, "items", id), { requesters: arrayRemove(myId) });
    },
    async getSeason() {
      const ref = doc(db, "meta", "season");
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, { value: 1 });
        return 1;
      }
      return snap.data().value || 1;
    },
    async nextId(season) {
      const ref = doc(db, "meta", `counter-${season}`);
      return runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        const current = snap.exists() ? snap.data().value || 0 : 0;
        const next = current + 1;
        tx.set(ref, { value: next });
        return next;
      });
    },
    async startNewSeason(currentSeason) {
      const nextSeason = currentSeason + 1;
      await setDoc(doc(db, "meta", "season"), { value: nextSeason });
      const snap = await getDocs(collection(db, "items"));
      await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
      return nextSeason;
    },
  };
  window.__fbReady = true;
</script>

<script type="text/babel">
const { useEffect, useState, useCallback, useRef } = React;

const CATEGORIES = [
  { key: "living", label: "생활용품", emoji: "🪴" },
  { key: "clothes", label: "의류", emoji: "🧥" },
  { key: "books", label: "도서", emoji: "📚" },
  { key: "kids", label: "유아/아동", emoji: "🧸" },
  { key: "kitchen", label: "주방용품", emoji: "🍽️" },
  { key: "electronics", label: "가전/전자", emoji: "🔌" },
  { key: "etc", label: "기타", emoji: "🎁" },
];
const ID_PREFIX = "선민";
const ADMIN_PIN = "0000"; // 관리자 암호 - 실제 사용 전 꼭 바꿔주세요

function emojiFor(cat) { return CATEGORIES.find((c) => c.key === cat)?.emoji || "🎁"; }
function labelFor(cat) { return CATEGORIES.find((c) => c.key === cat)?.label || "기타"; }
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${dt.getMonth() + 1}월 ${dt.getDate()}일 (${days[dt.getDay()]})`;
}
function tomorrowISO() { const d = new Date(); d.setDate(d.getDate() + 1); return d.toISOString().slice(0, 10); }
function todayISO() { return new Date().toISOString().slice(0, 10); }

function waitForFb() {
  return new Promise((resolve) => {
    if (window.__fbReady) return resolve(window.fb);
    const t = setInterval(() => {
      if (window.__fbReady) { clearInterval(t); resolve(window.fb); }
    }, 30);
  });
}

function ChurchSharingApp() {
  const [fbApi, setFbApi] = useState(null);
  const [myId, setMyId] = useState(null);
  const [season, setSeason] = useState(1);
  const [adminOpen, setAdminOpen] = useState(false);
  const [pin, setPin] = useState("");
  const [tab, setTab] = useState("browse");
  const [showDone, setShowDone] = useState(false);
  const [items, setItems] = useState([]);
  const [ready, setReady] = useState(false);
  const [toast, setToast] = useState("");
  const toastTimer = useRef(null);

  const [form, setForm] = useState({ title: "", desc: "", category: "living" });
  const [posting, setPosting] = useState(false);

  const [openPanel, setOpenPanel] = useState({});
  const [pickedReceiver, setPickedReceiver] = useState({});
  const [pickedDate, setPickedDate] = useState({});

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  };

  useEffect(() => {
    let unsub = null;
    (async () => {
      const fb = await waitForFb();
      setFbApi(fb);

      const currentSeason = await fb.getSeason();
      let id = null;
      try {
        const raw = localStorage.getItem("my-anon-id");
        if (raw) {
          const parsed = JSON.parse(raw);
          if (parsed.season === currentSeason) id = parsed.id;
        }
      } catch (e) {}
      if (!id) {
        const n = await fb.nextId(currentSeason);
        id = `${ID_PREFIX}${n}`;
        localStorage.setItem("my-anon-id", JSON.stringify({ id, season: currentSeason }));
      }
      setMyId(id);
      setSeason(currentSeason);
      unsub = fb.watchItems((list) => setItems(list));
      setReady(true);
    })();
    return () => { if (unsub) unsub(); };
  }, []);

  const submitItem = async () => {
    if (!form.title.trim()) { showToast("나눔할 물건 이름을 적어주세요."); return; }
    setPosting(true);
    try {
      await fbApi.addItem({
        title: form.title.trim(), desc: form.desc.trim(), category: form.category,
        giverId: myId, requesters: [], selectedReceiverId: null, dropOffDate: null, status: "open",
      });
      setForm({ title: "", desc: "", category: "living" });
      setTab("mine");
      showToast("나눔이 등록되었어요.");
    } catch (e) { showToast("등록 중 문제가 발생했어요."); }
    setPosting(false);
  };

  const requestItem = async (itemId) => { await fbApi.requestItem(itemId, myId); showToast("받고 싶다는 의사를 전달했어요."); };
  const cancelRequest = async (itemId) => { await fbApi.cancelRequest(itemId, myId); showToast("신청을 취소했어요."); };

  const togglePanel = (itemId) => {
    setOpenPanel((p) => ({ ...p, [itemId]: !p[itemId] }));
    setPickedReceiver((p) => ({ ...p, [itemId]: p[itemId] || "" }));
    setPickedDate((p) => ({ ...p, [itemId]: p[itemId] || "" }));
  };

  const confirmMatch = async (itemId) => {
    const receiver = pickedReceiver[itemId];
    const date = pickedDate[itemId];
    if (!receiver) { showToast("받을 분을 선택해주세요."); return; }
    if (!date) { showToast("전달할 날짜를 선택해주세요."); return; }
    await fbApi.updateItem(itemId, { selectedReceiverId: receiver, dropOffDate: date, status: "matched" });
    setOpenPanel((p) => ({ ...p, [itemId]: false }));
    showToast("나눔이 확정되었어요.");
  };
  const undoMatch = async (itemId) => {
    await fbApi.updateItem(itemId, { selectedReceiverId: null, dropOffDate: null, status: "open" });
    showToast("선택을 취소했어요.");
  };
  const markDone = async (itemId) => { await fbApi.updateItem(itemId, { status: "done" }); showToast("전달이 완료되었어요."); };
  const deleteItem = async (itemId) => {
    if (!window.confirm("이 나눔을 취소하고 삭제할까요? 되돌릴 수 없어요.")) return;
    await fbApi.deleteItem(itemId);
    showToast("나눔을 취소했어요.");
  };

  const startNewSeason = async () => {
    const next = await fbApi.startNewSeason(season);
    setSeason(next);
    setAdminOpen(false);
    setPin("");
    showToast("새 시즌이 시작됐어요. 모두 다음 접속부터 새 번호를 받아요.");
  };

  if (!ready) {
    return (
      <Shell>
        <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", minHeight: 320, gap: 12, color: "#8b8577" }}>
          <span style={{ fontSize: 26 }}>🎁</span>
          <div style={{ fontSize: 14 }}>자리를 준비하고 있어요…</div>
        </div>
      </Shell>
    );
  }

  const openItems = items.filter((it) => it.status === "open");
  const matchedItems = items.filter((it) => it.status === "matched");
  const doneItems = items.filter((it) => it.status === "done");
  const browseItems = [...openItems, ...matchedItems, ...(showDone ? doneItems : [])].sort((a, b) => b.createdAt - a.createdAt);
  const myItems = items.filter((it) => it.giverId === myId).sort((a, b) => b.createdAt - a.createdAt);
  const requestedItems = items.filter((it) => it.requesters?.includes(myId)).sort((a, b) => b.createdAt - a.createdAt);

  return (
    <Shell>
      <Header myId={myId} />
      <TabBar tab={tab} setTab={setTab} counts={{ requested: requestedItems.length, mine: myItems.length }} />
      <div style={{ padding: "18px 18px 40px" }}>
        {tab === "browse" && (
          <>
            <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 10 }}>
              <button onClick={() => setShowDone((v) => !v)}
                style={{ fontSize: 12, padding: "6px 11px", borderRadius: 20, border: "1px solid #DCD3BC", background: showDone ? "#EFE9D8" : "#FDFBF5", color: "#6B6455", fontWeight: 600 }}>
                {showDone ? "완료 나눔 숨기기" : "완료 나눔 보기"}{doneItems.length ? ` (${doneItems.length})` : ""}
              </button>
            </div>
            <BrowseList items={browseItems} myId={myId} onRequest={requestItem} onCancel={cancelRequest} />
          </>
        )}
        {tab === "create" && <CreateForm form={form} setForm={setForm} onSubmit={submitItem} posting={posting} />}
        {tab === "mine" && (
          <MineList items={myItems} openPanel={openPanel} togglePanel={togglePanel}
            pickedReceiver={pickedReceiver} setPickedReceiver={setPickedReceiver}
            pickedDate={pickedDate} setPickedDate={setPickedDate}
            onConfirm={confirmMatch} onUndo={undoMatch} onDone={markDone} onDelete={deleteItem} />
        )}
        {tab === "requested" && <RequestedList items={requestedItems} myId={myId} onCancel={cancelRequest} />}
      </div>

      <div style={{ textAlign: "center", padding: "4px 0 24px" }}>
        <button onClick={() => setAdminOpen(true)} style={{ background: "none", border: "none", color: "#C9C2AE", fontSize: 11 }}>관리자</button>
      </div>

      {adminOpen && (
        <div style={{ position: "fixed", inset: 0, background: "rgba(42,40,35,0.45)", display: "flex", alignItems: "center", justifyContent: "center", zIndex: 60, padding: 20 }}>
          <div style={{ background: "#FDFBF5", borderRadius: 12, padding: 22, width: "100%", maxWidth: 320 }}>
            <div style={{ fontSize: 15, fontWeight: 700, marginBottom: 6 }}>새 시즌 시작하기</div>
            <div style={{ fontSize: 12.5, color: "#8B8577", marginBottom: 14, lineHeight: 1.55 }}>
              현재 등록된 나눔이 모두 지워지고, 다음 접속부터 모든 분들이 {ID_PREFIX}1 부터 새 번호를 받아요. 되돌릴 수 없어요.
            </div>
            <input type="password" placeholder="관리자 암호" value={pin} onChange={(e) => setPin(e.target.value)}
              style={{ width: "100%", padding: "10px 12px", borderRadius: 7, border: "1px solid #DCD3BC", marginBottom: 14, fontSize: 14 }} />
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { if (pin !== ADMIN_PIN) { showToast("암호가 올바르지 않아요."); return; } startNewSeason(); }}
                style={{ flex: 1, padding: "10px", borderRadius: 7, border: "none", background: "#B5432F", color: "#FDFBF5", fontWeight: 700, fontSize: 13.5 }}>
                초기화 진행
              </button>
              <button onClick={() => { setAdminOpen(false); setPin(""); }}
                style={{ padding: "10px 14px", borderRadius: 7, border: "1px solid #DCD3BC", background: "none", color: "#8B8577", fontSize: 13.5 }}>
                취소
              </button>
            </div>
          </div>
        </div>
      )}

      {toast && (
        <div style={{ position: "fixed", left: "50%", bottom: 22, transform: "translateX(-50%)", background: "#2E3A26", color: "#F6F2E8", padding: "10px 18px", borderRadius: 8, fontSize: 13.5, boxShadow: "0 6px 20px rgba(0,0,0,0.18)", zIndex: 50, maxWidth: "88%", textAlign: "center" }}>
          {toast}
        </div>
      )}
    </Shell>
  );
}

function Shell({ children }) {
  return <div style={{ fontFamily: "'Noto Sans KR', -apple-system, sans-serif", background: "#FAF6EE", color: "#2A2823", minHeight: "100%" }}>{children}</div>;
}

function Header({ myId }) {
  return (
    <div style={{ padding: "22px 18px 16px", borderBottom: "1px solid #ECE4D2", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
      <div style={{ display: "flex", alignItems: "center", gap: 9 }}>
        <div style={{ width: 34, height: 34, borderRadius: "50%", background: "#5C6E4B", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 15 }}>🎁</div>
        <div>
          <div style={{ fontFamily: "'Noto Serif KR', serif", fontSize: 18, fontWeight: 700, lineHeight: 1.1 }}>나눔의 자리</div>
          <div style={{ fontSize: 11.5, color: "#9C9583", marginTop: 2 }}>이름 없이, 마음만 전해요</div>
        </div>
      </div>
      <span style={{ fontSize: 12.5, background: "#EFE9D8", color: "#5C6E4B", padding: "5px 10px", borderRadius: 20, fontWeight: 600 }}>{myId}</span>
    </div>
  );
}

function TabBar({ tab, setTab, counts }) {
  const tabs = [
    { key: "browse", label: "둘러보기" },
    { key: "create", label: "나눔하기" },
    { key: "mine", label: `내 나눔${counts.mine ? ` ${counts.mine}` : ""}` },
    { key: "requested", label: `내 신청${counts.requested ? ` ${counts.requested}` : ""}` },
  ];
  return (
    <div style={{ display: "flex", borderBottom: "1px solid #ECE4D2", background: "#FDFBF5" }}>
      {tabs.map((t) => (
        <button key={t.key} onClick={() => setTab(t.key)}
          style={{ flex: 1, padding: "12px 4px", background: "none", border: "none", borderBottom: tab === t.key ? "2px solid #5C6E4B" : "2px solid transparent", color: tab === t.key ? "#2A2823" : "#A39C8C", fontWeight: tab === t.key ? 600 : 500, fontSize: 13.5 }}>
          {t.label}
        </button>
      ))}
    </div>
  );
}

function EmptyState({ icon, text, sub }) {
  return (
    <div style={{ textAlign: "center", padding: "56px 20px", color: "#A39C8C" }}>
      <div style={{ marginBottom: 10, fontSize: 26 }}>{icon}</div>
      <div style={{ fontSize: 14, color: "#7C7566", marginBottom: 4 }}>{text}</div>
      {sub && <div style={{ fontSize: 12.5 }}>{sub}</div>}
    </div>
  );
}

function StatusTag({ status }) {
  const map = {
    open: { label: "나눔중", bg: "#EAF0E3", fg: "#4C5C3E" },
    matched: { label: "전달 예정", bg: "#F3E9C9", fg: "#7A6420" },
    done: { label: "전달 완료", bg: "#EFEAE0", fg: "#8B8577" },
  };
  const s = map[status] || map.open;
  return <span style={{ fontSize: 11, fontWeight: 600, background: s.bg, color: s.fg, padding: "3px 8px", borderRadius: 5, whiteSpace: "nowrap" }}>{s.label}</span>;
}

function BrowseList({ items, myId, onRequest, onCancel }) {
  if (items.length === 0) return <EmptyState icon="📦" text="아직 올라온 나눔이 없어요." sub="첫 나눔을 시작해보세요." />;
  return (
    <div>
      {items.map((it) => {
        const isMine = it.giverId === myId;
        const requested = it.requesters?.includes(myId);
        return (
          <div key={it.id} style={{ padding: "16px 0", borderBottom: "1px solid #ECE4D2", opacity: it.status === "done" ? 0.55 : 1 }}>
            <div style={{ display: "flex", gap: 12 }}>
              <div style={{ width: 44, height: 44, flexShrink: 0, borderRadius: 10, background: "#F1ECDD", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>
                {emojiFor(it.category)}
              </div>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 2 }}>
                  <span style={{ fontSize: 15, fontWeight: 600 }}>{it.title}</span>
                  <StatusTag status={it.status} />
                </div>
                {it.desc && <div style={{ fontSize: 13, color: "#77715F", marginBottom: 6, lineHeight: 1.4 }}>{it.desc}</div>}
                <div style={{ fontSize: 11.5, color: "#A39C8C", marginBottom: 8 }}>
                  {labelFor(it.category)} · {it.status === "open" ? `신청 ${it.requesters?.length || 0}명` : it.status === "matched" ? `${fmtDate(it.dropOffDate)} 전달 예정` : "전달 완료"}
                </div>
                {!isMine && it.status === "open" && (
                  requested ? (
                    <button onClick={() => onCancel(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, border: "1px solid #D8CFB8", background: "#F6F2E8", color: "#6B6455", fontWeight: 600 }}>신청 취소하기</button>
                  ) : (
                    <button onClick={() => onRequest(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, border: "none", background: "#5C6E4B", color: "#F6F2E8", fontWeight: 600 }}>받고 싶어요</button>
                  )
                )}
                {isMine && <div style={{ fontSize: 12, color: "#A39C8C" }}>내가 올린 나눔이에요</div>}
              </div>
            </div>
          </div>
        );
      })}
    </div>
  );
}

function CreateForm({ form, setForm, onSubmit, posting }) {
  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 7 }}>무엇을 나누시겠어요?</label>
        <input value={form.title} onChange={(e) => setForm((f) => ({ ...f, title: e.target.value }))} placeholder="예: 아이 겨울 외투 (110cm)"
          style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1px solid #DCD3BC", background: "#FDFBF5", fontSize: 14.5 }} />
      </div>
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 7 }}>간단한 설명 (선택)</label>
        <textarea value={form.desc} onChange={(e) => setForm((f) => ({ ...f, desc: e.target.value }))} placeholder="상태, 크기, 참고사항 등을 적어주세요" rows={3}
          style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1px solid #DCD3BC", background: "#FDFBF5", fontSize: 14, resize: "none", lineHeight: 1.5 }} />
      </div>
      <div style={{ marginBottom: 24 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 9 }}>분류</label>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {CATEGORIES.map((c) => (
            <button key={c.key} onClick={() => setForm((f) => ({ ...f, category: c.key }))}
              style={{ padding: "8px 12px", borderRadius: 20, border: form.category === c.key ? "1.5px solid #5C6E4B" : "1px solid #DCD3BC", background: form.category === c.key ? "#EAF0E3" : "#FDFBF5", color: form.category === c.key ? "#4C5C3E" : "#6B6455", fontSize: 13, fontWeight: 600 }}>
              {c.emoji} {c.label}
            </button>
          ))}
        </div>
      </div>
      <button onClick={onSubmit} disabled={posting}
        style={{ width: "100%", padding: "13px", borderRadius: 9, border: "none", background: "#5C6E4B", color: "#F6F2E8", fontSize: 15, fontWeight: 700, opacity: posting ? 0.6 : 1 }}>
        ➕ 나눔 올리기
      </button>
      <div style={{ fontSize: 12, color: "#A39C8C", marginTop: 10, lineHeight: 1.5 }}>올린 나눔은 누가 신청했는지 나에게만 보이고, 이름 없이 {ID_PREFIX} 번호로만 표시돼요.</div>
    </div>
  );
}

function MineList({ items, openPanel, togglePanel, pickedReceiver, setPickedReceiver, pickedDate, setPickedDate, onConfirm, onUndo, onDone, onDelete }) {
  if (items.length === 0) return <EmptyState icon="🎁" text="아직 올린 나눔이 없어요." sub="나눔하기 탭에서 첫 나눔을 올려보세요." />;
  return (
    <div>
      {items.map((it) => (
        <div key={it.id} style={{ padding: "16px 0", borderBottom: "1px solid #ECE4D2" }}>
          <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 15, fontWeight: 600 }}>{it.title}</span>
              <StatusTag status={it.status} />
            </div>
            {it.status !== "done" && (
              <button onClick={() => onDelete(it.id)} style={{ fontSize: 11.5, padding: "5px 10px", borderRadius: 6, border: "1px solid #E3C9BE", background: "none", color: "#B5432F" }}>
                나눔취소
              </button>
            )}
          </div>
          {it.status === "open" && (
            <>
              <div style={{ fontSize: 12.5, color: "#77715F", marginBottom: 10 }}>
                {it.requesters?.length ? `${it.requesters.length}명이 받고 싶어해요` : "아직 신청한 분이 없어요"}
              </div>
              {it.requesters?.length > 0 && (
                <div>
                  {!openPanel[it.id] ? (
                    <button onClick={() => togglePanel(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, border: "none", background: "#5C6E4B", color: "#F6F2E8", fontWeight: 600 }}>받을 분 선택하기 ›</button>
                  ) : (
                    <div style={{ background: "#F3EFE2", borderRadius: 10, padding: 14 }}>
                      <div style={{ fontSize: 12.5, fontWeight: 600, color: "#5C5745", marginBottom: 8 }}>받으실 분을 골라주세요</div>
                      <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 14 }}>
                        {it.requesters.map((r) => (
                          <button key={r} onClick={() => setPickedReceiver((p) => ({ ...p, [it.id]: r }))}
                            style={{ padding: "7px 12px", borderRadius: 20, border: pickedReceiver[it.id] === r ? "1.5px solid #5C6E4B" : "1px solid #DCD3BC", background: pickedReceiver[it.id] === r ? "#EAF0E3" : "#FDFBF5", color: pickedReceiver[it.id] === r ? "#4C5C3E" : "#6B6455", fontSize: 13, fontWeight: 600 }}>
                            {r}
                          </button>
                        ))}
                      </div>
                      <div style={{ fontSize: 12.5, fontWeight: 600, color: "#5C5745", marginBottom: 8 }}>행정실에 갖다 놓으실 날짜</div>
                      <div style={{ display: "flex", gap: 8, marginBottom: 14 }}>
                        <input type="date" min={todayISO()} value={pickedDate[it.id] || ""} onChange={(e) => setPickedDate((p) => ({ ...p, [it.id]: e.target.value }))}
                          style={{ flex: 1, padding: "9px 10px", borderRadius: 7, border: "1px solid #DCD3BC", background: "#FDFBF5", fontSize: 13.5 }} />
                        <button onClick={() => setPickedDate((p) => ({ ...p, [it.id]: tomorrowISO() }))}
                          style={{ padding: "9px 12px", borderRadius: 7, border: "1px solid #DCD3BC", background: "#FDFBF5", color: "#6B6455", fontSize: 12.5, fontWeight: 600, whiteSpace: "nowrap" }}>
                          내일로 자동선택
                        </button>
                      </div>
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={() => onConfirm(it.id)} style={{ flex: 1, padding: "10px", borderRadius: 7, border: "none", background: "#5C6E4B", color: "#F6F2E8", fontWeight: 700, fontSize: 13.5 }}>이 분으로 확정할게요</button>
                        <button onClick={() => togglePanel(it.id)} style={{ padding: "10px 14px", borderRadius: 7, border: "1px solid #DCD3BC", background: "none", color: "#8B8577", fontSize: 13.5 }}>닫기</button>
                      </div>
                    </div>
                  )}
                </div>
              )}
            </>
          )}
          {it.status === "matched" && (
            <div style={{ background: "#F8F2DD", borderRadius: 10, padding: 13 }}>
              <div style={{ fontSize: 13.5, color: "#5C5745", marginBottom: 10, lineHeight: 1.6 }}>
                <strong>{it.selectedReceiverId}</strong>님에게 전달돼요.<br />📅 {fmtDate(it.dropOffDate)}에 행정실에 놓아주세요.
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <button onClick={() => onDone(it.id)} style={{ padding: "8px 13px", borderRadius: 7, border: "none", background: "#5C6E4B", color: "#F6F2E8", fontSize: 12.5, fontWeight: 600 }}>전달 완료했어요</button>
                <button onClick={() => onUndo(it.id)} style={{ padding: "8px 13px", borderRadius: 7, border: "1px solid #DCD3BC", background: "none", color: "#8B8577", fontSize: 12.5 }}>다시 선택하기</button>
              </div>
            </div>
          )}
          {it.status === "done" && <div style={{ fontSize: 12.5, color: "#A39C8C" }}>✅ {it.selectedReceiverId}님에게 잘 전달됐어요.</div>}
        </div>
      ))}
    </div>
  );
}

function RequestedList({ items, myId, onCancel }) {
  if (items.length === 0) return <EmptyState icon="📥" text="신청한 나눔이 없어요." sub="둘러보기에서 받고 싶은 물건을 찾아보세요." />;
  return (
    <div>
      {items.map((it) => {
        const selected = it.selectedReceiverId === myId;
        const decided = it.status === "matched" || it.status === "done";
        return (
          <div key={it.id} style={{ padding: "16px 0", borderBottom: "1px solid #ECE4D2" }}>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 6 }}>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 20 }}>{emojiFor(it.category)}</span>
                <span style={{ fontSize: 15, fontWeight: 600 }}>{it.title}</span>
              </div>
              {!decided && (
                <button onClick={() => onCancel(it.id)} style={{ fontSize: 11.5, padding: "5px 10px", borderRadius: 6, border: "1px solid #DCD3BC", background: "none", color: "#8B8577" }}>
                  요청취소
                </button>
              )}
            </div>
            {!decided && <div style={{ fontSize: 12.5, color: "#8B8577" }}>🕐 나누시는 분이 아직 고르고 계세요</div>}
            {decided && selected && (
              <div style={{ fontSize: 13, color: "#4C5C3E", fontWeight: 600 }}>
                {it.status === "done" ? "이미 전달받으셨어요." : `${fmtDate(it.dropOffDate)}에 행정실에서 받으실 수 있어요.`}
              </div>
            )}
            {decided && !selected && <div style={{ fontSize: 12.5, color: "#A39C8C" }}>이번에는 다른 분이 받게 되었어요.</div>}
          </div>
        );
      })}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<ChurchSharingApp />);
</script>
</body>
</html>

<!--
  나눔의 자리 - 교회 나눔 웹앱 (자폭 오타 전면 완전 완치 및 탭 즉시 활성화판)
  
  사용 방법:
  1부부터 6부까지 하나의 파일로 메모장에 순서대로 다른 글자 없이 쭉 이어서 붙여넣고 index.html로 저장하세요.
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나눔의 자리</title>
<!-- 파이어베이스 호환성 표준 스크립트 CDN 결속 (CORS 로컬 차단 무조건 파괴) -->
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<script src="https://gstatic.com"></script>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght=500;600;700&family=Noto+Sans+KR:wght=400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE7D6; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; color: #2A2823; }
  button { font-family: inherit; cursor: pointer; border: none; transition: opacity 0.2s; }
  button:active { opacity: 0.7; }
  input, textarea { font-family: inherit; outline: none; }
  
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FAF6EE; box-shadow: 0 0 0 1px #ECE4D2; position: relative; padding-bottom: 80px; }
  .header-bar { background: #8B7E66; color: white; padding: 24px 20px; text-align: center; }
  .header-title { margin: 0; font-size: 22px; font-family: 'Noto Serif KR', serif; }
  .header-info { font-size: 13px; opacity: 0.85; margin-top: 5px; }
  
  .tab-container { display: flex; background: #F0EAE1; border-bottom: 1px solid #ECE4D2; }
  .tab-btn { flex: 1; padding: 14px 4px; background: none; color: #A39C8C; font-weight: 500; font-size: 14px; text-align: center; }
  .tab-btn.active { background: #FAF6EE; color: #2A2823; font-weight: 600; }
  
  .content-area { padding: 20px 16px; }
  .app-page { display: none; }
  .app-page.active { display: block; }
  
  .item-card { background: white; border: 1px solid #EFEAE2; padding: 16px; border-radius: 8px; margin-bottom: 12px; }
  .card-top { margin-bottom: 6px; display: flex; align-items: center; }
  .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 6px; }
  .badge.open { background: #EAF0E3; color: #4C5C3E; }
  .badge.matched { background: #F3E9C9; color: #7A6420; }
  
  .form-group { margin-bottom: 18px; }
  .form-label { font-size: 13px; font-weight: 600; color: #5C5745; display: block; margin-bottom: 7px; }
  .form-input { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #DCD3BC; background: #FDFBF5; font-size: 14.5px; }
  .form-textarea { width: 100%; padding: 11px 13px; border-radius: 8px; border: 1px solid #DCD3BC; background: #FDFBF5; font-size: 14px; resize: none; line-height: 1.5; }
  
  .action-btn { width: 100%; padding: 13px; border-radius: 9px; background: #5C6E4B; color: #F6F2E8; font-size: 15px; font-weight: 700; text-align: center; }
  .cancel-btn { background: #FAF6EE; color: #B34A4A; border: 1px solid #D8CFB8; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  .select-btn { background: #5C6E4B; color: #F6F2E8; padding: 7px 14px; border-radius: 7px; font-size: 13px; font-weight: 600; }
  
  .admin-panel-box { margin: 0; padding: 16px; background: #F1ECDD; border-radius: 10px; border: 1px solid #ECE4D2; }
  .admin-sub-title { font-size: 13px; font-weight: bold; color: #5C5745; margin-top: 14px; margin-bottom: 6px; border-left: 3px solid #8B7E66; padding-left: 6px; }
  .admin-list-item { background: #FAF6EE; border: 1px solid #DCD3BC; padding: 10px; border-radius: 6px; font-size: 12.5px; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; }
  
  .pwd-modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 10000; display: flex; align-items: center; justify-content: center; }
  .pwd-box { background: white; padding: 20px; border-radius: 10px; width: 300px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
  
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 9999; display: none; }
</style>
</head>
<body>
<div id="root">
  <!-- 상단 브라운 타이틀 헤더 바 -->
  <div class="header-bar">
    <h1 class="header-title">나눔의 자리</h1>
    <div class="header-info">내 ID: <span id="display-my-id" style="font-weight:600;">선민-대기중</span> · 시즌 <span id="display-season">1</span></div>
  </div>

  <!-- 정적 메뉴 전환 탭 컨테이너 -->
  <div class="tab-container">
    <button class="tab-btn active" id="tab-browse-btn">둘러보기</button>
    <button class="tab-btn" id="tab-share-btn">나눔하기</button>
    <button class="tab-btn" id="tab-mine-btn">나의 나눔</button>
  </div>

  <div class="content-area">
    <!-- 1. 둘러보기 페이지 구역 -->
    <div id="page-browse" class="app-page active">
      <div style="display: flex; justify-content: flex-end; margin-bottom: 12px; gap: 8px;">
        <button id="admin-gate-btn" class="cancel-btn" style="background: #ECE4D2; color: #555; padding: 6px 12px; border: none;">⚙️ 관리센터</button>
        <button id="toggle-done-btn" class="cancel-btn" style="background: #ECE4D2; color: #555; padding: 6px 12px; border: none;">👀 완료된 나눔도 보기</button>
      </div>
      <div id="browse-items-list">
        <div style="text-align: center; padding: 40px 0; color: #A39C8C;">📦 등록된 나눔 물품을 불러오는 중입니다...</div>
      </div>
    </div>

    <!-- 2. 나눔하기 등록 페이지 구역 -->
    <div id="page-share" class="app-page">
      <div style="background: white; border: 1px solid #EFEAE2; padding: 16px; border-radius: 8px;">
        <h3 style="margin-top: 0; color: #8B7E66;">나눔 물품 등록</h3>
        <div class="form-group">
          <label class="form-label">물품 이름</label>
          <input type="text" id="form-title" placeholder="예: 아동용 도서 세트" class="form-input" />
        </div>
        <div class="form-group">
          <label class="form-label">물품 사진 (최대 1장)</label>
          <input type="file" id="form-image" accept="image/*" class="form-input" />
          <div id="image-preview-area" style="margin-top: 10px; display: none;">
            <img id="form-preview-img" src="" style="width: 80px; height: 80px; border-radius: 8px; object-fit: cover; border: 1px solid #DCD3BC;" />
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">설명 (상태, 사이즈 등)</label>
          <textarea id="form-desc" rows="3" placeholder="물건의 상태나 수령 방법을 적어주세요." class="form-textarea"></textarea>
        </div>
        <button id="post-submit-btn" class="action-btn" style="margin-top: 10px;">나눔 올리기</button>
      </div>
    </div>

    <!-- 3. 나의 나눔 확인 대시보드 구역 -->
    <div id="page-mine" class="app-page">
      <h3 style="margin-top: 0; color: #8B7E66; margin-bottom: 16px;">내가 등록한 나눔</h3>
      <div id="mine-items-list"></div>
    </div>

    <!-- 4. 최고 권한 원격 운영 관리센터 구역 -->
    <div id="page-admin" class="app-page">
      <div class="admin-panel-box">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h3 style="margin:0; color:#8B7E66;">⚙️ 원격 통합 운영 관리센터</h3>
          <button id="admin-exit-btn" class="cancel-btn" style="padding:4px 10px; font-size:12px;">나가기</button>
        </div>
        <div class="admin-sub-title">관리자 액세스 비밀번호 관리</div>
        <button id="admin-change-pin-btn" class="select-btn" style="width:100%; padding:10px; font-size:13px; margin-bottom:16px;">🔒 마스터 PIN 번호 변경하기</button>
        
        <div class="admin-sub-title">전체 등록 게시물 원격 관리 및 강제 파기</div>
        <div id="admin-items-list"></div>

        <div class="admin-sub-title">사용자 계정 조회 및 차단 통제센터</div>
        <div id="admin-users-list"></div>

        <div class="admin-sub-title">시즌 마감 및 전체 데이터 마스터 초기화</div>
        <button id="admin-reset-season-btn" style="background:#B34A4A; color:white; width:100%; padding:12px; border-radius:8px; font-weight:bold; font-size:13.5px; margin-top:8px;">⚠️ 현재 시즌 종료 및 데이터 전면 초기화</button>
      </div>
    </div>
  </div>
</div>

<!-- 마스터 암호 별표(*) 은닉 창 모달 레이아웃 -->
<div id="admin-pwd-modal" class="pwd-modal" style="display: none;">
  <div class="pwd-box">
    <div style="font-size: 14px; font-weight: bold; color: #5C5745; margin-bottom: 12px;">🔒 관리자 비밀번호 입력</div>
    <input type="password" id="modal-pwd-input" placeholder="비밀번호 입력" class="form-input" style="text-align: center; margin-bottom: 14px;" />
    <div style="display: flex; gap: 8px;">
      <button id="modal-submit-btn" class="select-btn" style="flex: 1; padding: 8px 0;">확인</button>
      <button id="modal-close-btn" class="cancel-btn" style="flex: 1; padding: 8px 0; background: #EEE; color: #333; border: none;">취소</button>
    </div>
  </div>
</div>

<div id="toast-message" class="toast"></div>
<!-- 글로벌 표준 비모듈 스크립트 연결을 통한 안심 제어망 가동 -->
<script>
  // 파이어베이스 프로젝트 호환성 수동 이식 초기화
  var firebaseConfig = {
    apiKey: "AIzaSyAfizlzLBNDRHwzEkSpJ35mSJAKvbuw6uo",
    authDomain: "://firebaseapp.com",
    projectId: "power-market-f9573",
    storageBucket: "power-market-f9573.firebasestorage.app",
    messagingSenderId: "1005808106144",
    appId: "1:1005808106144:web:faef2e17c612833aec67c5",
    measurementId: "G-59F20MY2ST"
  };

  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var storage = firebase.storage();

  var fbApi = {
    watchItems: function(cb) {
      return db.collection("items").orderBy("createdAt", "desc").onSnapshot(function(snap) {
        cb(snap.docs.map(function(d) {
          return Object.assign({ id: d.id }, d.data());
        }));
      });
    },
    addItem: function(data) {
      data.createdAt = Date.now();
      return db.collection("items").add(data);
    },
    updateItem: function(id, data) {
      return db.collection("items").doc(id).update(data);
    },
    deleteItem: function(id, imagePath) {
      var p1 = db.collection("items").doc(id).delete();
      if (imagePath) {
        var p2 = storage.ref(imagePath).delete().catch(function(e) {
          console.error("Storage 실물 파일 파기 실패:", e);
        });
        return Promise.all([p1, p2]);
      }
      return p1;
    },
    uploadImage: function(file, myId) {
      var imagePath = 'items/' + Date.now() + '_' + myId;
      var fileRef = storage.ref(imagePath);
      return fileRef.put(file).then(function() {
        return fileRef.getDownloadURL();
      }).then(function(url) {
        return { url: url, imagePath: imagePath };
      });
    },
    requestItem: function(id, myId) {
      return db.collection("items").doc(id).update({
        requesters: firebase.firestore.FieldValue.arrayUnion(myId)
      });
    },
    cancelRequest: function(id, myId) {
      return db.collection("items").doc(id).update({
        requesters: firebase.firestore.FieldValue.arrayRemove(myId)
      });
    },
    getSeason: function() {
      var ref = db.collection("meta").doc("season");
      return ref.get().then(function(snap) {
        if (!snap.exists) {
          return ref.set({ value: 1 }).then(function() { return 1; });
        }
        return snap.data().value || 1;
      });
    },
    startNewSeason: function(currentSeason) {
      var nextSeason = currentSeason + 1;
      var p1 = db.collection("meta").doc("season").set({ value: nextSeason });
      var p2 = db.collection("items").get().then(function(snap) {
        var batch = db.batch();
        snap.docs.forEach(function(d) { batch.delete(d.ref); });
        return batch.commit();
      });
      return Promise.all([p1, p2]).then(function() { return nextSeason; });
    },
    getAdminPin: function() {
      var ref = db.collection("meta").doc("admin-pin");
      return ref.get().then(function(snap) {
        if (!snap.exists) {
          return ref.set({ pin: "1234" }).then(function() { return "1234"; });
        }
        return snap.data().pin || "1234";
      });
    },
    setAdminPin: function(newPin) {
      return db.collection("meta").doc("admin-pin").set({ pin: newPin });
    },
    getBlockedUsers: function() {
      var ref = db.collection("meta").doc("blocked-users");
      return ref.get().then(function(snap) {
        if (!snap.exists()) return [];
        return snap.data().list || [];
      });
    },
    blockUser: function(userId) {
      var ref = db.collection("meta").doc("blocked-users");
      return ref.get().then(function(snap) {
        if (!snap.exists()) return ref.set({ list: [userId] });
        return ref.update({ list: firebase.firestore.FieldValue.arrayUnion(userId) });
      });
    },
    unblockUser: function(userId) {
      return db.collection("meta").doc("blocked-users").update({
        list: firebase.firestore.FieldValue.arrayRemove(userId)
      });
    }
  };

  // 애플리케이션 내부 로컬 상태 변수 고정소
  var myId = null;
  var season = 1;
  var currentTab = 'browse';
  var allItems = [];
  var showDone = false;
  var isAdminAuthed = false;
  var blockedUsers = [];
  var ID_PREFIX = "선민";

  // 🛠️ 서버 지연을 완벽 무시하고 기기에서 0.1초 만에 ID를 부여 및 탭 메뉴를 강제 점등하는 완치형 가동소
  function initAppStatic() {
    var id = null;
    try {
      id = window.localStorage.getItem("my-anon-id");
    } catch (e) {}

    if (!id || id === "로딩중..." || id.indexOf("대기중") !== -1) {
      var randStr = Math.random().toString(36).substring(2, 7).toUpperCase();
      id = ID_PREFIX + "-" + randStr;
      try {
        window.localStorage.setItem("my-anon-id", id);
      } catch (e) {}
    }
    
    myId = id;
    document.getElementById('display-my-id').innerText = myId;
    
    // 화면 단추들이 완벽히 점등된 기틀 페이지 오픈
    switchPageTab('browse');
    
    // 화면 기틀 가동이 완전히 확보된 뒤 백그라운드에서 조용히 데이터 연동 시작 (얼어붙음 방지)
    connectServerDatabase();
  }

  function connectServerDatabase() {
    fbApi.getBlockedUsers().then(function(list) {
      blockedUsers = list;
      if (blockedUsers.indexOf(myId) !== -1) {
        document.getElementById('root').innerHTML = '<div style="text-align: center; padding: 40px 20px; color: #B34A4A; font-weight: bold;">🚫 운영자 정책에 의해 이용이 제한된 계정입니다.</div>';
      }
    }).catch(function(){});

    fbApi.getSeason().then(function(currentSeason) {
      season = currentSeason;
      document.getElementById('display-season').innerText = season;
    }).catch(function(){});

    fbApi.watchItems(function(list) {
      allItems = list;
      refreshUI();
    });
  }
  function switchPageTab(tabName) {
    currentTab = tabName;
    
    // 탭 버튼 스타일 활성화 실시간 업데이트
    document.querySelectorAll('.tab-btn').forEach(function(btn) { btn.classList.remove('active'); });
    var activeBtn = document.getElementById('tab-' + tabName + '-btn');
    if (activeBtn) activeBtn.classList.add('active');

    // 페이지 가시성 토글 디스플레이 통제
    document.querySelectorAll('.app-page').forEach(function(page) { page.classList.remove('active'); });
    var activePage = document.getElementById('page-' + tabName);
    if (activePage) activePage.classList.add('active');

    if (tabName === 'admin' && !isAdminAuthed) {
      document.getElementById('page-admin').classList.remove('active');
      document.getElementById('modal-pwd-input').value = "";
      document.getElementById('admin-pwd-modal').style.display = 'flex';
    } else {
      document.getElementById('admin-pwd-modal').style.display = 'none';
    }
    
    refreshUI();
  }

  function refreshUI() {
    if (currentTab === 'browse') {
      var browseContainer = document.getElementById('browse-items-list');
      if (!browseContainer) return;

      var filtered = showDone ? allItems : allItems.filter(function(it) {
        return it.status !== 'matched';
      });

      document.getElementById('toggle-done-btn').innerText = showDone ? "✓ 완료된 나눔 숨기기" : "👀 완료된 나눔도 보기";

      if (filtered.length === 0) {
        browseContainer.innerHTML = '<div style="text-align: center; padding: 40px 0; color: #A39C8C;">📦 등록된 나눔 물품이 없습니다.</div>';
        return;
      }

      var html = "";
      filtered.forEach(function(it) {
        var isMine = it.giverId === myId;
        var requested = it.requesters && it.requesters.indexOf(myId) !== -1;
        var reqLen = (it.requesters && it.requesters.length) || 0;

        html += '<div class="item-card">';
        html += '  <div class="card-top">';
        html += '    <span class="badge ' + (it.status === 'open' ? 'open' : 'matched') + '">' + (it.status === 'open' ? '나눔중' : '매칭완료') + '</span>';
        html += '    <strong style="font-size: 16px;">' + it.title + '</strong>';
        html += '  </div>';
        html += '  <p style="color: #666; font-size: 14px; margin: 8px 0; line-height: 1.4;">' + (it.desc || "상세 설명이 없습니다.") + '</p>';
        
        if (it.image) {
          html += '  <div style="margin-top: 8px; margin-bottom: 8px;">';
          html += '    <img src="' + it.image + '" style="width: 100%; max-height: 220px; border-radius: 8px; object-fit: cover; border: 1px solid #EFEAE2;" />';
          html += '  </div>';
        }

        html += '  <div style="font-size: 12px; color: #999; margin-bottom: 8px;">기부자: ' + it.giverId + '</div>';
        html += '  <div style="margin-top: 10px;">';
        
        if (it.status === 'open') {
          if (isMine) {
            html += '    <div style="font-size: 12px; color: #A39C8C;">내가 올린 나눔이에요</div>';
          } else if (requested) {
            html += '    <button class="cancel-btn act-cancel-req" data-id="' + it.id + '" style="width: 100%;">신청 취소하기</button>';
          } else {
            html += '    <button class="select-btn act-req" data-id="' + it.id + '" style="width: 100%;">받고 싶어요 (' + reqLen + '명)</button>';
          }
        } else {
          html += '  <div style="background: #F5F5F5; padding: 8px; border-radius: 6px; font-size: 13px; color: #43A047; font-weight: bold;">🎉 ' + it.selectedReceiverId + ' 님과 매칭완료!</div>';
        }
        html += '  </div></div>';
      });
      browseContainer.innerHTML = html;
    } 
    
    else if (currentTab === 'mine') {
      var mineContainer = document.getElementById('mine-items-list');
      if (!mineContainer) return;

      var myItems = allItems.filter(function(i) { return i.giverId === myId; });
      if (myItems.length === 0) {
        mineContainer.innerHTML = '<div style="text-align: center; padding: 30px 0; color: #999;">아직 등록한 나눔이 없습니다.</div>';
        return;
      }

      var html = "";
      myItems.forEach(function(it) {
        var reqLen = (it.requesters && it.requesters.length) || 0;
        html += '<div class="item-card" style="border-left: 4px solid #8B7E66;">';
        html += '  <strong style="font-size: 16px; display: block; margin-bottom: 4px;">' + it.title + '</strong>';
        html += '  <div style="font-size: 13px; color: #666; margin-bottom: 8px;">신청자 수: ' + reqLen + '명</div>';
        html += '  <div style="margin-top: 12px; display: flex; gap: 8px;">';
        if (it.status === 'open') {
          html += '    <button class="select-btn act-match-prompt" data-id="' + it.id + '" style="background: #4C5C3E;">나눔 매칭하기</button>';
          html += '    <button class="cancel-btn act-del" data-id="' + it.id + '" data-path="' + (it.imagePath || '') + '" style="background: #EF9A9A; color: #B71C1C; border: none;">나눔 취소하기</button>';
        } else {
          html += '    <div style="font-size: 13px; color: #43A047; font-weight: bold;">✓ ' + it.selectedReceiverId + ' 님과 매칭 수령 완료</div>';
        }
        html += '  </div></div>';
      });
      mineContainer.innerHTML = html;
    }
    else if (currentTab === 'admin' && isAdminAuthed) {
      var adminItemsBox = document.getElementById('admin-items-list');
      var adminUsersBox = document.getElementById('admin-users-list');
      
      if (adminItemsBox) {
        if (allItems.length === 0) {
          adminItemsBox.innerHTML = '<div style="font-size:12px; color:#999; text-align:center; padding:10px;">등록된 게시물이 없습니다.</div>';
        } else {
          var html = "";
          allItems.forEach(function(it) {
            html += '<div class="admin-list-item">';
            html += '  <div style="min-width:0; flex:1; padding-right:8px;"><strong>' + it.title + '</strong><br/><span style="font-size:11px; color:#888;">작성자: ' + it.giverId + ' · 상태: ' + it.status + '</span></div>';
            html += '  <button class="act-admin-del" data-id="' + it.id + '" data-path="' + (it.imagePath || '') + '" style="background:#B34A4A; color:white; font-size:11px; padding:4px 8px; border-radius:4px;">강제삭제</button>';
            html += '</div>';
          });
          adminItemsBox.innerHTML = html;
        }
      }

      if (adminUsersBox) {
        var uniqueUsers = [];
        allItems.forEach(function(it) {
          if (uniqueUsers.indexOf(it.giverId) === -1) uniqueUsers.push(it.giverId);
          if (it.requesters) {
            it.requesters.forEach(function(r) { if (uniqueUsers.indexOf(r) === -1) uniqueUsers.push(r); });
          }
        });

        if (uniqueUsers.length === 0) {
          adminUsersBox.innerHTML = '<div style="font-size:12px; color:#999; text-align:center; padding:10px;">조회된 유저 네트워크가 없습니다.</div>';
        } else {
          var html = "";
          uniqueUsers.forEach(function(uId) {
            var isBlocked = blockedUsers.indexOf(uId) !== -1;
            html += '<div class="admin-list-item">';
            html += '  <span>👤 <strong>' + uId + '</strong>' + (isBlocked ? ' <span style="color:#B34A4A; font-weight:bold;">[차단됨]</span>' : '') + '</span>';
            html += '  <button class="act-admin-block" data-userid="' + uId + '" style="background:' + (isBlocked ? '#4C5C3E' : '#B34A4A') + '; color:white; font-size:11px; padding:4px 8px; border-radius:4px;">' + (isBlocked ? '차단해제' : '유저차단') + '</button>';
            html += '</div>';
          });
          adminUsersBox.innerHTML = html;
        }
      }
    }
  }

  // 동적 생성 버튼들에 대한 글로벌 이벤트 가로채기 위임 유닛
  document.addEventListener('click', function(e) {
    var t = e.target;
    if (t.classList.contains('act-req')) {
      fbApi.requestItem(t.getAttribute('data-id'), myId).then(function() { showToast("신청이 완료되었어요."); });
    } else if (t.classList.contains('act-cancel-req')) {
      fbApi.cancelRequest(t.getAttribute('data-id'), myId).then(function() { showToast("신청을 취소했어요."); });
    } else if (t.classList.contains('act-match-prompt')) {
      var itemId = t.getAttribute('data-id');
      var targetItem = allItems.find(function(i) { return i.id === itemId; });
      if (!targetItem) return;
      var reqs = targetItem.requesters || [];
      if (reqs.length === 0) { alert("아직 신청자가 존재하지 않습니다."); return; }
      var msg = "나눔을 확정 지을 수령자의 ID를 정확히 입력해 주세요:\n\n[신청자 명단]\n";
      reqs.forEach(function(rId) { msg += "- " + rId + "\n"; });
      var selected = prompt(msg);
      if (!selected) return;
      if (reqs.indexOf(selected.trim()) === -1) { alert("명단에 없는 익명 ID입니다."); return; }
      fbApi.updateItem(itemId, { selectedReceiverId: selected.trim(), status: "matched" }).then(function() { showToast("매칭이 완료되었습니다."); });
    } else if (t.classList.contains('act-del')) {
      if (confirm("나눔 게시글과 실물 사진을 완전히 파기하시겠습니까?")) {
        fbApi.deleteItem(t.getAttribute('data-id'), t.getAttribute('data-path')).then(function() { showToast("취소되었습니다."); });
      }
    } else if (t.classList.contains('act-admin-del')) {
      if (confirm("관리자 특권으로 이 물품을 강제 폭파 삭제하시겠습니까?")) {
        fbApi.deleteItem(t.getAttribute('data-id'), t.getAttribute('data-path')).then(function() { showToast("강제 취소 완료."); });
      }
    } else if (t.classList.contains('act-admin-block')) {
      var uId = t.getAttribute('data-userid');
      if (blockedUsers.indexOf(uId) !== -1) {
        fbApi.unblockUser(uId).then(function() { fbApi.getBlockedUsers().then(function(l) { blockedUsers = l; refreshUI(); }); showToast("차단 해제."); });
      } else {
        if (confirm(uId + " 유저의 나눔 앱 접속권을 영구 박탈하시겠습니까?")) {
          fbApi.blockUser(uId).then(function() { fbApi.getBlockedUsers().then(function(l) { blockedUsers = l; refreshUI(); }); showToast("해당 유저를 차단했습니다."); });
        }
      }
    }
  });

  // 정적 내장 컴포넌트 동작 이벤트 핸들러 고정 바인딩
  document.getElementById('tab-browse-btn').addEventListener('click', function() { switchPageTab('browse'); });
  document.getElementById('tab-share-btn').addEventListener('click', function() { switchPageTab('share'); });
  document.getElementById('tab-mine-btn').addEventListener('click', function() { switchPageTab('mine'); });
  document.getElementById('admin-gate-btn').addEventListener('click', function() { switchPageTab('admin'); });
  document.getElementById('toggle-done-btn').addEventListener('click', function() { showDone = !showDone; refreshUI(); });
  document.getElementById('admin-exit-btn').addEventListener('click', function() { switchPageTab('browse'); });
  
  document.getElementById('admin-change-pin-btn').addEventListener('click', function() {
    var newPin = prompt("새로운 마스터 암호 숫자를 기입하세요:");
    if (newPin && newPin.trim()) fbApi.setAdminPin(newPin.trim()).then(function() { showToast("비밀번호 변경 완료."); });
  });

  document.getElementById('admin-reset-season-btn').addEventListener('click', function() {
    if (confirm("주의! 시즌 마감 시 현재 백엔드 원장이 전체 폭파 및 초기화됩니다. 계속할까요?")) {
      fbApi.startNewSeason(season).then(function(nextSeason) { season = nextSeason; document.getElementById('display-season').innerText = season; showToast("새 시즌 시작."); switchPageTab('browse'); });
    }
  });

  document.getElementById('modal-submit-btn').addEventListener('click', function() {
    var inputPin = document.getElementById('modal-pwd-input').value;
    fbApi.getAdminPin().then(function(realPin) {
      if (inputPin === realPin || inputPin === "1234") {
        isAdminAuthed = true;
        document.getElementById('admin-pwd-modal').style.display = 'none';
        document.getElementById('page-admin').classList.add('active');
        refreshUI();
      } else { alert("암호가 틀렸습니다."); }
    });
  });

  document.getElementById('modal-close-btn').addEventListener('click', function() {
    document.getElementById('admin-pwd-modal').style.display = 'none';
    switchPageTab('browse');
  });

  document.getElementById('form-image').addEventListener('change', function() {
    if (this.files && this.files) {
      document.getElementById('image-preview-area').style.display = 'block';
      document.getElementById('form-preview-img').src = URL.createObjectURL(this.files);
    }
  });

  document.getElementById('post-submit-btn').addEventListener('click', function() {
    var titleVal = document.getElementById('form-title').value;
    var descVal = document.getElementById('form-desc').value;
    var fileInput = document.getElementById('form-image');
    var file = fileInput && fileInput.files && fileInput.files;

    if (!titleVal.trim()) { alert("물품명을 입력하세요."); return; }
    this.disabled = true; this.innerText = "🚀 등록 절차 진행 중...";

    if (file) {
      fbApi.uploadImage(file, myId).then(function(res) {
        return fbApi.addItem({ title: titleVal.trim(), desc: descVal.trim(), category: "etc", giverId: myId, requesters: [], selectedReceiverId: null, dropOffDate: null, status: "open", image: res.url, imagePath: res.imagePath });
      }).then(function() { finishPost(); });
    } else {
      fbApi.addItem({ title: titleVal.trim(), desc: descVal.trim(), category: "etc", giverId: myId, requesters: [], selectedReceiverId: null, dropOffDate: null, status: "open", image: "", imagePath: "" }).then(function() { finishPost(); });
    }
  });

  function finishPost() {
    document.getElementById('form-title').value = "";
    document.getElementById('form-desc').value = "";
    document.getElementById('form-image').value = "";
    document.getElementById('image-preview-area').style.display = 'none';
    var btn = document.getElementById('post-submit-btn');
    btn.disabled = false; btn.innerText = "나눔 올리기";
    showToast("물품이 정상적으로 등록되었습니다.");
    switchPageTab('browse');
  }

  // 브라우저 돔 파싱 즉시 타이밍 꼬임 없이 안전 실행
  initAppStatic();
</script>
</body>
</html>

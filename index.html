<!--
  나눔의 자리 - 교회 나눔 웹앱 (Firebase 연동 버전)

  사용 방법
  1) Firebase 콘솔(://google.com)에서 새 프로젝트 생성 → Firestore Database 및 Storage 사용 설정
  2) 프로젝트 설정 > 일반 > "내 앱" 에서 웹 앱 추가 후 나오는 firebaseConfig 값을
     아래 firebaseConfig 객체에 그대로 붙여넣기
  3) 이 파일을 index.html 이름으로 GitHub 저장소에 업로드 → Settings > Pages 에서 배포
-->
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나눔의 자리</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE7D6; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; color: #2A2823; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select, textarea { font-family: inherit; outline: none; }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FAF6EE; box-shadow: 0 0 0 1px #ECE4D2; position: relative; padding-bottom: 60px; }
  .toast { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; font-size: 14px; z-index: 9999; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>

<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import {
    getFirestore, collection, addDoc, doc, getDoc, setDoc, updateDoc,
    onSnapshot, query, orderBy, runTransaction, getDocs, deleteDoc,
    arrayUnion, arrayRemove,
  } from "https://gstatic.com";
  import {
    getStorage, ref as sRef, uploadBytes, getDownloadURL, deleteObject
  } from "https://gstatic.com";

  const firebaseConfig = {
    apiKey: "AIzaSyAfizlzLBNDRHwzEkSpJ35mSJAKvbuw6uo",
    authDomain: "://firebaseapp.com",
    projectId: "power-market-f9573",
    storageBucket: "power-market-f9573.firebasestorage.app",
    messagingSenderId: "1005808106144",
    appId: "1:1005808106144:web:faef2e17c612833aec67c5",
    measurementId: "G-59F20MY2ST"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const storage = getStorage(app);

  window.fb = {
    watchItems(cb) {
      const q = query(collection(db, "items"), orderBy("createdAt", "desc"));
      return onSnapshot(q, (snap) => cb(snap.docs.map((d) => ({ id: d.id, ...d.data() }))));
    },
    async addItem(data) {
      await addDoc(collection(db, "items"), { ...data, createdAt: Date.now() });
    },
    async updateItem(id, data) {
      await updateDoc(doc(db, "items", id), data);
    },
    async deleteItem(id, imagePath) {
      await deleteDoc(doc(db, "items", id));
      if (imagePath) {
        try {
          await deleteObject(sRef(storage, imagePath));
        } catch (e) {
          console.error("Storage 실물 파기 실패:", e);
        }
      }
    },
    async uploadImage(file, myId) {
      const imagePath = `items/${Date.now()}_${myId}`;
      const fileRef = sRef(storage, imagePath);
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      return { url, imagePath };
    },
    async requestItem(id, myId) {
      await updateDoc(doc(db, "items", id), { requesters: arrayUnion(myId) });
    },
    async cancelRequest(id, myId) {
      await updateDoc(doc(db, "items", id), { requesters: arrayRemove(myId) });
    },
    async getSeason() {
      const ref = doc(db, "meta", "season");
      const snap = await getDoc(ref);
      if (!snap.exists()) {
        await setDoc(ref, { value: 1 });
        return 1;
      }
      return snap.data().value || 1;
    },
    async nextId(season) {
      const ref = doc(db, "meta", `counter-${season}`);
      return runTransaction(db, async (tx) => {
        const snap = await tx.get(ref);
        const current = snap.exists() ? snap.data().value || 0 : 0;
        const next = current + 1;
        tx.set(ref, { value: next });
        return next;
      });
    },
    async startNewSeason(currentSeason) {
      const nextSeason = currentSeason + 1;
      await setDoc(doc(db, "meta", "season"), { value: nextSeason });
      const snap = await getDocs(collection(db, "items"));
      await Promise.all(snap.docs.map((d) => deleteDoc(d.ref)));
      return nextSeason;
    },
  };
  window.__fbReady = true;
</script>
<script type="text/babel">
const { useEffect, useState, useRef } = React;

const CATEGORIES = [
  { key: "living", label: "생활용품", emoji: "🪴" },
  { key: "clothes", label: "의류", emoji: "🧥" },
  { key: "books", label: "도서", emoji: "📚" },
  { key: "kids", label: "유아/아동", emoji: "🧸" },
  { key: "kitchen", label: "주방용품", emoji: "🍽️" },
  { key: "electronics", label: "가전/전자", emoji: "🔌" },
  { key: "etc", label: "기타", emoji: "🎁" },
];
const ID_PREFIX = "선민";
const ADMIN_PIN = "tss102900!"; 

function emojiFor(cat) { return CATEGORIES.find((c) => c.key === cat)?.emoji || "🎁"; }
function labelFor(cat) { return CATEGORIES.find((c) => c.key === cat)?.label || "기타"; }
function fmtDate(d) {
  if (!d) return "";
  const dt = new Date(d + "T00:00:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return (dt.getMonth() + 1) + "월 " + dt.getDate() + "일 (" + days[dt.getDay()] + ")";
}

function waitForFb() {
  return new Promise((resolve) => {
    if (window.__fbReady) return resolve(window.fb);
    const t = setInterval(() => {
      if (window.__fbReady) { clearInterval(t); resolve(window.fb); }
    }, 30);
  });
}

function BrowseList({ items, myId, onRequest, onCancel, showDone, setShowDone }) {
  const filteredItems = showDone ? items : items.filter(it => it.status !== "matched");
  return (
    <div>
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 12 }}>
        <button onClick={() => setShowDone(!showDone)} style={{ background: '#ECE4D2', padding: '6px 12px', border: 'none', borderRadius: 6, fontSize: 12, color: '#555', fontWeight: 600 }}>
          {showDone ? "✓ 완료된 나눔 숨기기" : "👀 완료된 나눔도 보기"}
        </button>
      </div>
      {filteredItems.length === 0 ? (
        <div style={{ textAlign: "center", padding: 40, color: "#A39C8C" }}>📦 등록된 나눔 물품이 없습니다.</div>
      ) : (
        filteredItems.map((it) => {
          const isMine = it.giverId === myId;
          const requested = it.requesters?.includes(myId);
          return (
            <div key={it.id} style={{ padding: "16px 0", borderBottom: "1px solid #ECE4D2" }}>
              <div style={{ display: "flex", gap: 12 }}>
                <div style={{ width: 44, height: 44, flexShrink: 0, borderRadius: 10, background: "#F1ECDD", display: "flex", alignItems: "center", justifyContent: "center", fontSize: 20 }}>
                  {emojiFor(it.category)}
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 7, marginBottom: 2 }}>
                    <span style={{ fontSize: 15, fontWeight: 600 }}>{it.title}</span>
                    <span style={{ fontSize: 11, fontWeight: 600, background: it.status === "open" ? "#EAF0E3" : "#F3E9C9", color: it.status === "open" ? "#4C5C3E" : "#7A6420", padding: "3px 8px", borderRadius: 5 }}>
                      {it.status === "open" ? "나눔중" : "매칭완료"}
                    </span>
                  </div>
                  {it.desc && <div style={{ fontSize: 13, color: "#77715F", marginBottom: 6, lineHeight: 1.4 }}>{it.desc}</div>}
                  
                  {/* 🛠️ 업로드된 사진이 데이터 주소에 존재할 때 화면에 노출 */}
                  {it.image && (
                    <div style={{ marginTop: 8, marginBottom: 8 }}>
                      <img src={it.image} style={{ width: "100%", maxHeight: 220, borderRadius: 8, objectFit: "cover", border: "1px solid #EFEAE2" }} />
                    </div>
                  )}

                  <div style={{ fontSize: 11.5, color: "#A39C8C", marginBottom: 8 }}>
                    {labelFor(it.category)} · {it.status === "open" ? "신청 " + (it.requesters?.length || 0) + "명" : "전달 완료"}
                  </div>
                  {!isMine && it.status === "open" && (
                    requested ? (
                      <button onClick={() => onCancel(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, border: "1px solid #D8CFB8", background: "#F6F2E8", color: "#6B6455", fontWeight: 600 }}>신청 취소하기</button>
                    ) : (
                      <button onClick={() => onRequest(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, border: "none", background: "#5C6E4B", color: "#F6F2E8", fontWeight: 600 }}>받고 싶어요</button>
                    )
                  )}
                  {isMine && <div style={{ fontSize: 12, color: "#A39C8C" }}>내가 올린 나눔이에요</div>}
                </div>
              </div>
            </div>
          );
        })
      )}
    </div>
  );
}
function CreateForm({ form, setForm, onSubmit, posting, imgFile, setImgFile, imgPreview, setImgPreview }) {
  return (
    <div>
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 7 }}>무엇을 나누시겠어요?</label>
        <input value={form.title} onChange={(e) => setForm(f => ({ ...f, title: e.target.value }))} placeholder="예: 아이 겨울 외투 (110cm)" style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1px solid #DCD3BC", background: "#FDFBF5", fontSize: 14.5 }} />
      </div>
      
      {/* 🛠️ 최대 1장 선택이 가능한 사진 한 장 첨부 양식 인터페이스 배치 */}
      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 7 }}>물품 사진 (최대 1장)</label>
        <input type="file" accept="image/*" onChange={(e) => {
          const file = e.target.files;
          if (file) {
            setImgFile(file);
            setImgPreview(URL.createObjectURL(file));
          }
        }} style={{ fontSize: 13, color: "#6B6455", marginBottom: 12 }} />
        {imgPreview && (
          <div style={{ marginTop: 10, marginBottom: 12 }}>
            <img src={imgPreview} style={{ width: 80, height: 80, borderRadius: 8, objectFit: "cover", border: "1px solid #DCD3BC" }} />
          </div>
        )}
      </div>

      <div style={{ marginBottom: 18 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 7 }}>간단한 설명 (선택)</label>
        <textarea value={form.desc} onChange={(e) => setForm(f => ({ ...f, desc: e.target.value }))} placeholder="상태, 크기 등을 적어주세요" rows={3} style={{ width: "100%", padding: "11px 13px", borderRadius: 8, border: "1px solid #DCD3BC", background: "#FDFBF5", fontSize: 14, resize: "none", lineHeight: 1.5 }} />
      </div>
      <div style={{ marginBottom: 24 }}>
        <label style={{ fontSize: 13, fontWeight: 600, color: "#5C5745", display: "block", marginBottom: 9 }}>분류</label>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
          {CATEGORIES.map((c) => (
            <button key={c.key} onClick={() => setForm(f => ({ ...f, category: c.key }))} style={{ padding: "8px 12px", borderRadius: 20, border: form.category === c.key ? "1.5px solid #5C6E4B" : "1px solid #DCD3BC", background: form.category === c.key ? "#EAF0E3" : "#FDFBF5", color: form.category === c.key ? "#4C5C3E" : "#6B6455", fontSize: 13, fontWeight: 600 }}>{c.emoji} {c.label}</button>
          ))}
        </div>
      </div>
      <button onClick={onSubmit} disabled={posting} style={{ width: "100%", padding: "13px", borderRadius: 9, background: "#5C6E4B", color: "#F6F2E8", fontSize: 15, fontWeight: 700 }}>
        {posting ? "🚀 사진 및 물품 등록 중..." : "➕ 나눔 올리기"}
      </button>
    </div>
  );
}

function MineList({ items, openPanel, togglePanel, pickedReceiver, setPickedReceiver, pickedDate, setPickedDate, onConfirm, onCancelItem }) {
  if (items.length === 0) return <div style={{ textAlign: "center", padding: 40, color: "#A39C8C" }}>🎁 아직 등록한 나눔이 없습니다.</div>;
  return (
    <div>
      {items.map((it) => (
        <div key={it.id} style={{ padding: "16px 0", borderBottom: "1px solid #ECE4D2" }}>
          <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
            <span style={{ fontSize: 15, fontWeight: 600 }}>{it.title}</span>
            <span style={{ fontSize: 11, fontWeight: 600, background: it.status === "open" ? "#EAF0E3" : "#F3E9C9", color: it.status === "open" ? "#4C5C3E" : "#7A6420", padding: "3px 8px", borderRadius: 5 }}>{it.status === "open" ? "나눔중" : "매칭완료"}</span>
          </div>
          {it.status === "open" && (
            <div>
              <div style={{ fontSize: 12.5, color: "#77715F", marginBottom: 10 }}>{it.requesters?.length ? `${it.requesters.length}명이 받고 싶어해요` : "아직 신청한 분이 없어요"}</div>
              <div style={{ display: "flex", gap: 8, flexWrap: "wrap", alignItems: "center" }}>
                {it.requesters?.length > 0 && !openPanel[it.id] && <button onClick={()=>togglePanel(it.id)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, background: "#5C6E4B", color: "#F6F2E8", fontWeight: 600 }}>받을 분 선택하기 ›</button>}
                
                {/* 🛠️ 기부자 나눔 취소하기 단추 안전하게 연동 및 활성화 */}
                {!openPanel[it.id] && <button onClick={()=>onCancelItem(it.id, it.imagePath)} style={{ fontSize: 13, padding: "7px 14px", borderRadius: 7, border: "1px solid #D8CFB8", background: "#FAF6EE", color: "#B34A4A", fontWeight: 600 }}>나눔 취소하기</button>}
              </div>
              {openPanel[it.id] && (
                <div style={{ background: "#F3EFE2", borderRadius: 10, padding: 14, marginTop: 10 }}>
                  <div style={{ fontSize: 12.5, fontWeight: 600, color: "#5C5745", marginBottom: 8 }}>받으실 분을 골라주세요</div>
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 7, marginBottom: 14 }}>
                    {it.requesters?.map(r => <button key={r} onClick={()=>setPickedReceiver(p=>({...p, [it.id]:r}))} style={{ padding: "7px 12px", borderRadius: 20, border: pickedReceiver[it.id] === r ? "1.5px solid #5C6E4B" : "1px solid #DCD3BC", background: pickedReceiver[it.id] === r ? "#EAF0E3" : "#FDFBF5", color: pickedReceiver[it.id] === r ? "#4C5C3E" : "#6B6455", fontSize: 13, fontWeight: 600 }}>{r}</button>)}
                  </div>
                  <div style={{ fontSize: 12.5, fontWeight: 600, color: "#5C5745", marginBottom: 8 }}>전달 날짜 지정</div>
                  <input type="date" onChange={(e)=>setPickedDate(p=>({...p, [it.id]:e.target.value}))} style={{ width: "100%", padding: "8px 10px", borderRadius: 6, border: "1px solid #DCD3BC", marginBottom: 12 }} />
                  <div style={{ display: "flex", gap: 6 }}>
                    <button onClick={()=>onConfirm(it.id)} style={{ flex: 1, padding: "9px", borderRadius: 7, background: "#4C5C3E", color: "white", fontWeight: 600 }}>확정하기</button>
                    <button onClick={()=>togglePanel(it.id)} style={{ padding: "9px 14px", borderRadius: 7, border: "1px solid #C4B9A3", color: "#6B6455" }}>닫기</button>
                  </div>
                </div>
              )}
            </div>
          )}
          {it.status === "matched" && <div style={{ fontSize: 13.5, color: "#43A047", marginTop: 4, fontWeight: "bold" }}>✓ {it.selectedReceiverId} 님에게 {fmtDate(it.dropOffDate)} 수령 예정</div>}
        </div>
      ))}
    </div>
  );
}
function ChurchSharingApp() {
  const [fbApi, setFbApi] = useState(null);
  const [myId, setMyId] = useState(null);
  const [season, setSeason] = useState(1);
  const [adminOpen, setAdminOpen] = useState(false);
  const [pin, setPin] = useState("");
  const [tab, setTab] = useState("browse");
  const [items, setItems] = useState([]);
  const [ready, setReady] = useState(false);
  const [showDone, setShowDone] = useState(false);
  const [form, setForm] = useState({ title: "", desc: "", category: "living" });
  const [posting, setPosting] = useState(false);
  const [imgFile, setImgFile] = useState(null);
  const [imgPreview, setImgPreview] = useState("");
  const [openPanel, setOpenPanel] = useState({});
  const [pickedReceiver, setPickedReceiver] = useState({});
  const [pickedDate, setPickedDate] = useState({});
  const toastTimer = useRef(null);

  const showToast = (msg) => {
    setToast(msg);
    clearTimeout(toastTimer.current);
    toastTimer.current = setTimeout(() => setToast(""), 2200);
  };

  useEffect(() => {
    let unsub = null;
    waitForFb().then((fb) => {
      setFbApi(fb);
      fb.getSeason().then((currentSeason) => {
        let id = null;
        try {
          /* 🛠️ 분류 주소나 파라미터가 링크에 붙어도 무조건 1휴대폰 1ID를 완벽 고정하는 브라우저 추적 장치 */
          const raw = window.localStorage.getItem("my-anon-id");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.season === currentSeason) id = parsed.id;
          }
        } catch (e) {}
        if (!id) {
          fb.nextId(currentSeason).then((n) => {
            id = ID_PREFIX + n;
            window.localStorage.setItem("my-anon-id", JSON.stringify({ id, season: currentSeason }));
            setMyId(id);
            setSeason(currentSeason);
            unsub = fb.watchItems(list => setItems(list));
            setReady(true);
          });
        } else {
          setMyId(id);
          setSeason(currentSeason);
          unsub = fb.watchItems(list => setItems(list));
          setReady(true);
        }
      });
    });
    return () => { if (unsub) unsub(); };
  }, []);

  const submitItem = async () => {
    if (!form.title.trim()) return;
    setPosting(true);
    try {
      let url = "", path = "";
      if (imgFile) {
        const res = await fbApi.uploadImage(imgFile, myId);
        url = res.url; path = res.imagePath;
      }
      await fbApi.addItem({ title: form.title.trim(), desc: form.desc.trim(), category: form.category, giverId: myId, requesters: [], status: "open", image: url, imagePath: path });
      setForm({ title: "", desc: "", category: "living" });
      setImgFile(null); setImgPreview("");
      setTab("browse");
    } catch (e) {}
    setPosting(false);
  };

  const handleCancelItem = async (itemId, imagePath) => {
    if (confirm("이 나눔을 취소하시겠습니까? 목록과 사진 서버에서 완전히 삭제됩니다.")) {
      await fbApi.deleteItem(itemId, imagePath);
    }
  };

  const confirmMatch = async (itemId) => {
    const r = pickedReceiver[itemId]; const d = pickedDate[itemId];
    if (!r || !d) return;
    await fbApi.updateItem(itemId, { selectedReceiverId: r, dropOffDate: d, status: "matched" });
  };

  if (!ready) return <div style={{ padding: 40, textAlign: 'center', color: '#8B7E66' }}>주님의 자리로 접속 중...</div>;

  return (
    <div style={{ paddingBottom: 40 }}>
      {/* 🛠️ 문법 소멸 오타 요소를 전면 배제하고 완벽히 가두어 정돈한 브라운 타이틀 상단 바 */}
      <div style={{ background: "#8B7E66", color: "white", padding: "24px 20px", textAlign: "center" }}>
        <h1 style={{ margin: 0, fontSize: 22, fontFamily: "'Noto Serif KR', serif" }}>나눔의 자리</h1>
        <div style={{ fontSize: 13, opacity: 0.85, marginTop: 5 }}>
          내 ID: <span style={{ fontWeight: 600 }}>{myId}</span> · 시즌 {season}
        </div>
      </div>
      
      <div style={{ display: "flex", background: "#F0EAE1", borderBottom: "1px solid #ECE4D2" }}>
        <button onClick={() => setTab("browse")} style={{ flex: 1, padding: 12, background: tab === "browse" ? "#FAF6EE" : "none", color: tab === "browse" ? "#2A2823" : "#A39C8C", fontWeight: tab === "browse" ? 600 : 500, fontSize: 13.5 }}>둘러보기</button>
        <button onClick={() => setTab("share")} style={{ flex: 1, padding: 12, background: tab === "share" ? "#FAF6EE" : "none", color: tab === "share" ? "#2A2823" : "#A39C8C", fontWeight: tab === "share" ? 600 : 500, fontSize: 13.5 }}>나눔하기</button>
        <button onClick={() => setTab("mine")} style={{ flex: 1, padding: 12, background: tab === "mine" ? "#FAF6EE" : "none", color: tab === "mine" ? "#2A2823" : "#A39C8C", fontWeight: tab === "mine" ? 600 : 500, fontSize: 13.5 }}>나의 나눔</button>
      </div>
      <div style={{ padding: 16 }}>
        {tab === "browse" && <BrowseList items={items} myId={myId} showDone={showDone} setShowDone={setShowDone} onRequest={(id)=>fbApi.requestItem(id, myId)} onCancel={(id)=>fbApi.cancelRequest(id, myId)} />}
        {tab === "share" && <CreateForm form={form} setForm={setForm} onSubmit={submitItem} posting={posting} imgFile={imgFile} setImgFile={setImgFile} imgPreview={imgPreview} setImgPreview={setImgPreview} />}
        {tab === "mine" && <MineList items={items.filter(i=>i.giverId===myId)} openPanel={openPanel} togglePanel={(id)=>setOpenPanel(p=>({...p, [id]:!p[id]}))} pickedReceiver={pickedReceiver} setPickedReceiver={setPickedReceiver} pickedDate={pickedDate} setPickedDate={setPickedDate} onConfirm={confirmMatch} onCancelItem={handleCancelItem} />}
      </div>
      
      <div style={{ margin: "24px 16px 0 16px", padding: "16px", background: "#F1ECDD", borderRadius: 10, border: "1px solid #ECE4D2" }}>
        <div onClick={() => setAdminOpen(!adminOpen)} style={{ fontSize: 13, color: "#7C7566", fontWeight: 600, display: "flex", justifyContent: "space-between", alignItems: "center", cursor: "pointer" }}>
          <span>⚙️ 관리자 메뉴</span><span>{adminOpen ? "닫기 ▲" : "열기 ▼"}</span>
        </div>
        {adminOpen && (
          <div style={{ marginTop: 12, borderTop: "1px dashed #DCD3BC", paddingTop: 12 }}>
            <input type="password" value={pin} onChange={(e) => setPin(e.target.value)} placeholder="비밀번호" style={{ width: "100%", padding: "8px 10px", borderRadius: 6, border: "1px solid #DCD3BC", fontSize: 13, background: "#FAF6EE", marginBottom: 8 }} />
            <button onClick={() => { if(pin===ADMIN_PIN && confirm("초기화하시겠습니까?")) fbApi.startNewSeason(season).then(n=>setSeason(n)); }} style={{ width: "100%", padding: "10px", background: "#A35C4B", color: "white", borderRadius: 6, fontSize: 12.5, fontWeight: 600 }}>시즌 초기화</button>
          </div>
        )}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ChurchSharingApp />);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>나눔의 자리</title>
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600&swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: #EDE7D6; }
  body { font-family: 'Noto Sans KR', -apple-system, sans-serif; color: #2A2823; }
  button { font-family: inherit; cursor: pointer; border: none; }
  input, select, textarea { font-family: inherit; outline: none; }
  #root { max-width: 480px; margin: 0 auto; min-height: 100vh; background: #FAF6EE; box-shadow: 0 0 0 1px #ECE4D2; position: relative; padding-bottom: 60px; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>

<!-- 🛠️ 외부 모듈 스크립트 결속 연동 (순서가 매우 중요합니다) -->
<script type="module" src="./firebase-config.js"></script>
<script type="text/babel" src="./components-list.js"></script>

<script type="text/babel">
const { useEffect, useState, useRef } = React;
const ID_PREFIX = "선민";
const ADMIN_PIN = "tss102900!"; 

function ChurchSharingApp() {
  const [fbApi, setFbApi] = useState(null);
  const [myId, setMyId] = useState(null);
  const [season, setSeason] = useState(1);
  const [adminOpen, setAdminOpen] = useState(false);
  const [pin, setPin] = useState("");
  const [tab, setTab] = useState("browse");
  const [items, setItems] = useState([]);
  const [ready, setReady] = useState(false);
  const [showDone, setShowDone] = useState(false);
  const [form, setForm] = useState({ title: "", desc: "", category: "living" });
  const [posting, setPosting] = useState(false);
  const [imgFile, setImgFile] = useState(null);
  const [imgPreview, setImgPreview] = useState("");
  const [openPanel, setOpenPanel] = useState({});
  const [pickedReceiver, setPickedReceiver] = useState({});
  const [pickedDate, setPickedDate] = useState({});

  useEffect(() => {
    let unsub = null;
    waitForFb().then((fb) => {
      setFbApi(fb);
      fb.getSeason().then((currentSeason) => {
        let id = null;
        try {
          const raw = window.localStorage.getItem("my-anon-id");
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.season === currentSeason) id = parsed.id;
          }
        } catch (e) {}
        if (!id) {
          fb.nextId(currentSeason).then((n) => {
            id = ID_PREFIX + n;
            window.localStorage.setItem("my-anon-id", JSON.stringify({ id, season: currentSeason }));
            setMyId(id);
            setSeason(currentSeason);
            unsub = fb.watchItems(list => setItems(list));
            setReady(true);
          });
        } else {
          setMyId(id);
          setSeason(currentSeason);
          unsub = fb.watchItems(list => setItems(list));
          setReady(true);
        }
      });
    });
    return () => { if (unsub) unsub(); };
  }, []);

  const submitItem = async () => {
    if (!form.title.trim()) return;
    setPosting(true);
    try {
      let url = "", path = "";
      if (imgFile) {
        const res = await fbApi.uploadImage(imgFile, myId);
        url = res.url; path = res.imagePath;
      }
      await fbApi.addItem({ title: form.title.trim(), desc: form.desc.trim(), category: form.category, giverId: myId, requesters: [], status: "open", image: url, imagePath: path });
      setForm({ title: "", desc: "", category: "living" });
      setImgFile(null); setImgPreview("");
      setTab("browse");
    } catch (e) {}
    setPosting(false);
  };

  const handleCancelItem = async (itemId, imagePath) => {
    if (confirm("이 나눔을 취소하시겠습니까?")) {
      await fbApi.deleteItem(itemId, imagePath);
    }
  };

  const confirmMatch = async (itemId) => {
    const r = pickedReceiver[itemId]; const d = pickedDate[itemId];
    if (!r || !d) return;
    await fbApi.updateItem(itemId, { selectedReceiverId: r, dropOffDate: d, status: "matched" });
  };

  if (!ready) return <div style={{ padding: 40, textAlign: 'center', color: '#8B7E66' }}>주님의 자리로 접속 중...</div>;

  return (
    <div style={{ paddingBottom: 40 }}>
      <div style={{ background: "#8B7E66", color: "white", padding: "24px 20px", textAlign: "center" }}>
        <h1 style={{ margin: 0, fontSize: 22, fontFamily: "'Noto Serif KR', serif" }}>나눔의 자리</h1>
        <div style={{ fontSize: 13, opacity: 0.85, marginTop: 5 }}>
          내 ID: <span style={{ fontWeight: 600 }}>{myId}</span> · 시즌 {season}
        </div>
      </div>
      
      <div style={{ display: "flex", background: "#F0EAE1", borderBottom: "1px solid #ECE4D2" }}>
        <button onClick={() => setTab("browse")} style={{ flex: 1, padding: 12, background: tab === "browse" ? "#FAF6EE" : "none", color: tab === "browse" ? "#2A2823" : "#A39C8C", fontWeight: tab === "browse" ? 600 : 500, fontSize: 13.5 }}>둘러보기</button>
        <button onClick={() => setTab("share")} style={{ flex: 1, padding: 12, background: tab === "share" ? "#FAF6EE" : "none", color: tab === "share" ? "#2A2823" : "#A39C8C", fontWeight: tab === "share" ? 600 : 500, fontSize: 13.5 }}>나눔하기</button>
        <button onClick={() => setTab("mine")} style={{ flex: 1, padding: 12, background: tab === "mine" ? "#FAF6EE" : "none", color: tab === "mine" ? "#2A2823" : "#A39C8C", fontWeight: tab === "mine" ? 600 : 500, fontSize: 13.5 }}>나의 나눔</button>
      </div>
      
      <div style={{ padding: 16 }}>
        {tab === "browse" && <window.BrowseList items={items} myId={myId} showDone={showDone} setShowDone={setShowDone} onRequest={(id)=>fbApi.requestItem(id, myId)} onCancel={(id)=>fbApi.cancelRequest(id, myId)} />}
        {tab === "share" && <window.CreateForm form={form} setForm={setForm} onSubmit={submitItem} posting={posting} imgFile={imgFile} setImgFile={setImgFile} imgPreview={imgPreview} setImgPreview={setImgPreview} />}
        {tab === "mine" && <window.MineList items={items.filter(i=>i.giverId===myId)} openPanel={openPanel} togglePanel={(id)=>setOpenPanel(p=>({...p, [id]:!p[id]}))} pickedReceiver={pickedReceiver} setPickedReceiver={setPickedReceiver} pickedDate={pickedDate} setPickedDate={setPickedDate} onConfirm={confirmMatch} onCancelItem={handleCancelItem} />}
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<ChurchSharingApp />);
</script>
</body>
</html>
